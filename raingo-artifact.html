<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RainGo</title>
<style>
:root{--go-1:#0D9E5A;--go-2:#0A7A44;--wait-1:#E8920A;--wait-2:#C47208;--delay-1:#D42B2B;--delay-2:#A01F1F;--idle-1:#1C1C2E;--idle-2:#111120}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',system-ui,sans-serif;color:#fff}
body{min-height:100vh;overflow-y:auto;overflow-x:hidden}
#bg{min-height:100vh;background:linear-gradient(145deg,var(--idle-1),var(--idle-2));transition:background .5s ease;display:flex;flex-direction:column;align-items:center;position:relative;padding-bottom:32px}
#bg.go   {background:linear-gradient(145deg,var(--go-1),var(--go-2))}
#bg.wait {background:linear-gradient(145deg,var(--wait-1),var(--wait-2))}
#bg.delay{background:linear-gradient(145deg,var(--delay-1),var(--delay-2))}

/* flash overlay */
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:50;transition:opacity .5s ease}

/* pulse rings */
.ring{position:absolute;top:140px;left:50%;transform:translateX(-50%);width:260px;height:260px;border-radius:50%;border:1.5px solid rgba(255,255,255,.25);opacity:0;display:none;pointer-events:none}
.ring.on{display:block;animation:expand 2.5s ease-out infinite}
.ring.on.lag{animation-delay:1s}
@keyframes expand{0%{transform:translateX(-50%) scale(.5);opacity:.3}100%{transform:translateX(-50%) scale(1.7);opacity:0}}

/* decision card */
#content{display:flex;flex-direction:column;align-items:center;gap:20px;padding:72px 28px 24px;text-align:center;z-index:1;width:100%;max-width:420px}
.icon{font-size:64px;line-height:1;filter:drop-shadow(0 4px 14px rgba(0,0,0,.3))}
.big-num{font-size:78px;font-weight:800;letter-spacing:-2px;line-height:1;text-shadow:0 2px 16px rgba(0,0,0,.25)}
.big-unit{font-size:13px;opacity:.5;margin-top:-10px;letter-spacing:.7px;text-transform:uppercase}
.headline{font-size:clamp(26px,7vw,42px);font-weight:700;letter-spacing:-.5px;line-height:1.1;text-shadow:0 2px 8px rgba(0,0,0,.15)}
.sub{font-size:15px;opacity:.8;max-width:290px;line-height:1.6}
.conf-pill{display:flex;align-items:center;gap:7px;padding:6px 14px;background:rgba(255,255,255,.12);border-radius:100px;font-size:12px;font-weight:500;opacity:.65}
.cdot{width:7px;height:7px;border-radius:50%}
.cdot.hi{background:#7AE28C}.cdot.lo{background:#FFD166}

/* prediction strip */
#pred-strip{width:calc(100% - 32px);max-width:380px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:13px 16px;display:none;flex-direction:row;justify-content:space-around;backdrop-filter:blur(10px);z-index:1}
#pred-strip.on{display:flex}
.pstat{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1}
.pval{font-size:18px;font-weight:700}
.plbl{font-size:9px;opacity:.45;letter-spacing:.5px;text-transform:uppercase}
.pdiv{width:1px;background:rgba(255,255,255,.12);align-self:stretch}

/* spinner */
.spin{width:40px;height:40px;border:3px solid rgba(255,255,255,.18);border-top-color:#fff;border-radius:50%;animation:rot .75s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* map section */
#map-wrap{width:calc(100% - 32px);max-width:420px;z-index:1;margin-top:8px}
#map-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;padding:0 2px}
#map-title{font-size:10px;font-weight:600;opacity:.4;letter-spacing:.9px;text-transform:uppercase}
#map-legend{display:flex;gap:8px}
.leg{display:flex;align-items:center;gap:3px;font-size:9px;opacity:.38}
.leg-dot{width:7px;height:7px;border-radius:50%}
canvas#map{width:100%;border-radius:14px;display:block;border:1px solid rgba(255,255,255,.07)}

/* timeline */
#timeline{display:flex;align-items:center;gap:6px;padding:10px 2px 0;width:100%}
#tl-play{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .2s}
#tl-play:hover{background:rgba(255,255,255,.25)}
#tl-track{flex:1;display:flex;align-items:center;gap:6px;overflow:hidden}
.tldot{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;flex:1}
.tldot-circle{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25);transition:all .2s;margin:0 auto}
.tldot.active .tldot-circle{background:#fff;width:10px;height:10px}
.tldot:hover .tldot-circle{background:rgba(255,255,255,.65)}
.tldot-lbl{font-size:8px;opacity:.35;white-space:nowrap}
#tl-live{padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:10px;font-weight:600;cursor:pointer;letter-spacing:.4px;flex-shrink:0;transition:background .2s}
#tl-live.active{background:rgba(255,255,255,.28);border-color:rgba(255,255,255,.4)}
#tl-live:hover{background:rgba(255,255,255,.22)}
#history-banner{display:none;width:calc(100% - 32px);max-width:420px;text-align:center;font-size:11px;opacity:.55;padding:4px 0 0;letter-spacing:.3px;z-index:1}
#history-banner.on{display:block}

/* footer */
#footer{width:calc(100% - 32px);max-width:420px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:1;padding-top:14px}
#age{font-size:11px;opacity:.32}
#countdown{font-size:11px;opacity:.28;font-variant-numeric:tabular-nums}
#loc{font-size:11.5px;opacity:.48;display:flex;align-items:center;gap:5px}
#btn{width:100%;padding:16px;background:rgba(255,255,255,.16);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.18);border-radius:16px;color:#fff;font-size:16px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .2s;font-family:inherit}
#btn:disabled{opacity:.32;cursor:default}
#btn:not(:disabled):hover{background:rgba(255,255,255,.25)}
#alert-btn{padding:10px 20px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:100px;color:rgba(255,255,255,.75);font-size:13px;font-weight:500;cursor:pointer;display:none;align-items:center;gap:7px;transition:background .2s;font-family:inherit}
#alert-btn.on{display:flex}
#alert-btn:hover{background:rgba(255,255,255,.18)}
#share-btn{padding:10px 20px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:100px;color:rgba(255,255,255,.75);font-size:13px;font-weight:500;cursor:pointer;display:none;align-items:center;gap:7px;transition:background .2s;font-family:inherit}
#share-btn.on{display:flex}
#share-btn:hover{background:rgba(255,255,255,.18)}
#share-row{display:flex;gap:8px;justify-content:center;width:100%}

/* toast */
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);backdrop-filter:blur(10px);color:#fff;font-size:13px;font-weight:500;padding:9px 18px;border-radius:100px;opacity:0;pointer-events:none;z-index:60;transition:opacity .25s;white-space:nowrap}
#toast.show{opacity:1}

/* badges */
.badge{position:fixed;top:14px;background:rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.1);border-radius:8px;font-size:10px;padding:4px 9px;z-index:30;letter-spacing:.5px;font-family:inherit;cursor:default}
#src-badge{left:14px}
#dbg-btn{right:14px;cursor:pointer;color:rgba(255,255,255,.35)}
#dbg-btn:hover{color:rgba(255,255,255,.7)}

/* debug */
#debug{position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,.92);backdrop-filter:blur(10px);padding:12px 16px 20px;font-size:10px;font-family:'SF Mono','Fira Code',monospace;max-height:220px;overflow-y:auto;display:none;z-index:10;border-top:1px solid rgba(255,255,255,.07)}
#debug.open{display:block}
#debug pre{color:#adf;line-height:1.65;white-space:pre-wrap}
</style>
</head>
<body>
<div id="flash"></div>
<div id="toast"></div>

<div id="bg">
  <div class="ring" id="r1"></div>
  <div class="ring lag" id="r2"></div>

  <div id="content">
    <div class="spin"></div>
    <div class="sub">Getting your location…</div>
  </div>

  <div id="pred-strip">
    <div class="pstat"><div class="pval" id="p-time">—</div><div class="plbl">hitting in</div></div>
    <div class="pdiv"></div>
    <div class="pstat"><div class="pval" id="p-dir">—</div><div class="plbl">approaching from</div></div>
    <div class="pdiv"></div>
    <div class="pstat"><div class="pval" id="p-size">—</div><div class="plbl">storm width</div></div>
  </div>

  <div id="map-wrap">
    <div id="map-hdr">
      <span id="map-title">Rain Radar · Singapore</span>
      <div id="map-legend">
        <span class="leg"><span class="leg-dot" style="background:#5090ff"></span>Light</span>
        <span class="leg"><span class="leg-dot" style="background:#ffcc00"></span>Moderate</span>
        <span class="leg"><span class="leg-dot" style="background:#ff4040"></span>Heavy</span>
      </div>
    </div>
    <canvas id="map"></canvas>
    <div id="timeline">
      <button id="tl-play" title="Play history">▶</button>
      <div id="tl-track"></div>
      <button id="tl-live" class="active">● LIVE</button>
    </div>
  </div>

  <div id="history-banner"></div>

  <div id="footer">
    <div id="age"></div>
    <div id="countdown"></div>
    <div id="loc">
      <svg width="9" height="12" viewBox="0 0 9 12" fill="currentColor"><path d="M4.5 0C2.015 0 0 2.015 0 4.5 0 7.875 4.5 12 4.5 12S9 7.875 9 4.5C9 2.015 6.985 0 4.5 0zm0 6a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></svg>
      <span id="loc-text">Singapore</span>
    </div>
    <div id="share-row">
      <button id="alert-btn">🔔 Remind me when safe</button>
      <button id="share-btn">↗ Share</button>
    </div>
    <button id="btn" disabled>↺&nbsp; Check again</button>
  </div>
</div>

<div class="badge" id="src-badge">NEA</div>
<button class="badge" id="dbg-btn">debug</button>
<div id="debug"><pre id="dbg-pre"></pre></div>

<script>
'use strict';

// ── CONFIG ──────────────────────────────────────────────────────────────────
const DEFAULT_LAT = 1.2657294;
const DEFAULT_LNG = 103.8227098;
const NEA_URL     = 'https://api.data.gov.sg/v1/environment/rainfall';
const GEO_URL     = 'https://nominatim.openstreetmap.org/reverse';
const MAX_MM=5,I_THRESH=20,EPS_KM=5,MIN_PTS=2,DEF_SPEED=20,DELAY_T=10,WAIT_T=25;
const DRIZZLE_AVG_I=80;   // below this = drizzle / light rain
const NEAREST_KM=5;       // nearest-station check radius — 5km covers sparse areas like Kallang
const NEAREST_MIN_I=15;   // minimum intensity for nearest-station check
const MAX_MATCH_KM=20;    // max centroid displacement between frames for velocity matching
const SPEED_MIN=2,SPEED_MAX=60; // plausible storm speed bounds (km/h)
const MAX_HIST=6;
const REFRESH_INTERVAL = 5 * 60; // seconds

// Map canvas bounds (covers SG + buffer)
const LAT_MIN=1.12, LAT_MAX=1.52, LNG_MIN=103.52, LNG_MAX=104.18;

// ── SINGAPORE MAIN ISLAND (clockwise from SW Tuas, ~80 points) ──────────────
// Derived from actual coastline geography. Key landmarks:
//   Tuas SW ~(1.317, 103.638) | Woodlands ~(1.452, 103.766) | Changi ~(1.366, 104.011)
//   Marina Bay S ~(1.279, 103.852) | HarbourFront ~(1.255, 103.820)
const SG = [
  // SW → up west coast (Tuas → Pioneer → Lim Chu Kang → Kranji)
  [1.317, 103.638],[1.324, 103.639],[1.333, 103.640],[1.342, 103.643],
  [1.352, 103.650],[1.363, 103.658],[1.374, 103.666],[1.387, 103.673],
  [1.401, 103.680],[1.416, 103.689],[1.428, 103.699],[1.438, 103.706],
  // NW coast (Mandai → Sungei Buloh → Woodlands Checkpoint)
  [1.446, 103.714],[1.451, 103.728],[1.453, 103.743],[1.453, 103.758],
  [1.452, 103.769],[1.451, 103.781],
  // N coast (Woodlands → Sembawang → Canberra → Yishun)
  [1.452, 103.796],[1.453, 103.812],[1.453, 103.825],[1.451, 103.836],
  [1.449, 103.847],[1.446, 103.858],
  // NE coast (Seletar → Punggol → Punggol Point)
  [1.441, 103.868],[1.435, 103.877],[1.427, 103.887],[1.420, 103.896],
  [1.413, 103.903],[1.405, 103.909],
  // East toward Changi (Pasir Ris → Loyang → Changi Village)
  [1.396, 103.917],[1.386, 103.932],[1.378, 103.945],[1.372, 103.959],
  [1.376, 103.972],[1.383, 103.985],[1.383, 103.999],
  // Changi tip (NE protrusion) and back south
  [1.373, 104.008],[1.358, 104.012],[1.345, 104.009],
  // SE coast going south (Tanah Merah → East Coast)
  [1.330, 104.001],[1.317, 103.988],[1.310, 103.973],[1.304, 103.958],
  [1.299, 103.941],[1.296, 103.924],[1.294, 103.908],
  // S coast (Tanjong Rhu → Kallang → Marina Bay)
  [1.292, 103.892],[1.288, 103.876],[1.284, 103.866],[1.281, 103.859],
  [1.279, 103.852],[1.277, 103.844],
  // SW coast (Tanjong Pagar → Keppel → HarbourFront)
  [1.273, 103.836],[1.268, 103.829],[1.263, 103.824],[1.259, 103.820],
  [1.255, 103.820],
  // West coast (Labrador → Pasir Panjang → West Coast → Jurong)
  [1.252, 103.812],[1.255, 103.803],[1.261, 103.796],[1.268, 103.789],
  [1.277, 103.781],[1.285, 103.774],[1.293, 103.764],[1.300, 103.755],
  [1.307, 103.747],[1.313, 103.737],[1.318, 103.726],[1.323, 103.717],
  // Pioneer → Tuas industrial
  [1.330, 103.707],[1.337, 103.698],[1.341, 103.685],[1.340, 103.668],
  [1.334, 103.654],[1.325, 103.643],
  [1.317, 103.638], // close
];

// Sentosa Island
const SENTOSA = [
  [1.249, 103.800],[1.247, 103.810],[1.251, 103.822],[1.249, 103.835],
  [1.244, 103.847],[1.239, 103.843],[1.237, 103.830],[1.240, 103.815],
  [1.244, 103.803],[1.249, 103.800],
];

// Jurong Island (petrochemical, south of Jurong)
const JURONG_ISLAND = [
  [1.277, 103.693],[1.271, 103.702],[1.265, 103.710],[1.264, 103.726],
  [1.268, 103.737],[1.278, 103.737],[1.285, 103.730],[1.288, 103.718],
  [1.284, 103.705],[1.277, 103.693],
];

// ── STATE ───────────────────────────────────────────────────────────────────
let userLat=DEFAULT_LAT, userLng=DEFAULT_LNG, locationLabel='Singapore';
let liveFrame=null;
let historyFrames=[];
let viewingIdx=null;
let isPlaying=false, playTimer=null;
let mapRaf=null, pulseT=0;
let prevState=null;
let countdownSec=REFRESH_INTERVAL, countdownInterval=null;
let alertScheduled=false, alertTimeout=null;

// ── GEO HELPERS ─────────────────────────────────────────────────────────────
function hav(a1,o1,a2,o2){
  const R=6371,r=Math.PI/180,da=(a2-a1)*r,dl=(o2-o1)*r;
  const x=Math.sin(da/2)**2+Math.cos(a1*r)*Math.cos(a2*r)*Math.sin(dl/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
function bearingDeg(a1,o1,a2,o2){
  const r=Math.PI/180,dl=(o2-o1)*r;
  const y=Math.sin(dl)*Math.cos(a2*r);
  const x=Math.cos(a1*r)*Math.sin(a2*r)-Math.sin(a1*r)*Math.cos(a2*r)*Math.cos(dl);
  return(Math.atan2(y,x)*180/Math.PI+360)%360;
}
const COMPASS=['North','NE','East','SE','South','SW','West','NW'];
const ARROWS  =['↓','↙','←','↖','↑','↗','→','↘'];
const compass=d=>COMPASS[Math.round(d/45)%8];
const arrow  =d=>ARROWS[Math.round(d/45)%8];

// ── ALGORITHM ───────────────────────────────────────────────────────────────
function dbscan(pts,eps,min){
  const n=pts.length,L=new Array(n).fill(0);let id=1;
  const nb=i=>{const r=[];for(let j=0;j<n;j++)if(j!==i&&hav(pts[i].lat,pts[i].lng,pts[j].lat,pts[j].lng)<=eps)r.push(j);return r;};
  for(let i=0;i<n;i++){
    if(L[i])continue;const s=nb(i);
    if(s.length+1<min){L[i]=-1;continue;}
    L[i]=id;const q=new Set(s);
    for(const j of q){if(L[j]===-1)L[j]=id;if(L[j])continue;L[j]=id;const jn=nb(j);if(jn.length+1>=min)jn.forEach(r=>q.add(r));}
    id++;
  }
  const out=[];for(let c=1;c<id;c++)out.push(pts.filter((_,i)=>L[i]===c));
  return out;
}
function clusterCells(cells){
  // Pass 1 — moderate/heavy rain (intensity>60): eps=5km
  const heavy=cells.filter(c=>c.intensity>60);
  const heavyClusters=heavy.length>=MIN_PTS
    ?dbscan(heavy,EPS_KM,MIN_PTS).map(pts=>buildCluster(pts))
    :[];
  const heavyIds=new Set(heavyClusters.flatMap(c=>c.points.map(p=>p.lat+','+p.lng)));

  // Pass 2 — light rain (intensity 20-60): eps=3km, only cells not already clustered
  const light=cells.filter(c=>c.intensity>I_THRESH&&c.intensity<=60&&!heavyIds.has(c.lat+','+c.lng));
  const lightClusters=light.length>=MIN_PTS
    ?dbscan(light,3,MIN_PTS).map(pts=>buildCluster(pts))
    :[];

  return [...heavyClusters,...lightClusters];
}
function buildCluster(pts){
  const lat=pts.reduce((s,p)=>s+p.lat,0)/pts.length;
  const lng=pts.reduce((s,p)=>s+p.lng,0)/pts.length;
  const maxI=Math.max(...pts.map(p=>p.intensity));
  const avgI=pts.reduce((s,p)=>s+p.intensity,0)/pts.length;
  const radiusKm=Math.max(1,...pts.map(p=>hav(lat,lng,p.lat,p.lng)));
  return{centroid:{lat,lng},points:pts,maxI,avgI,radiusKm,velocity:null};
}
// Match current clusters to previous frame clusters and compute velocity vectors.
// dLat/dLng are in deg/hr; speedKmh is the magnitude.
function computeVelocity(currClusters,prevClusters,intervalMin){
  if(!prevClusters||!prevClusters.length||intervalMin<=0)return currClusters;
  const LAT_KM=111.0;
  const LNG_KM=111.32*Math.cos(1.35*Math.PI/180); // ~111.0*cos(1.35°) ≈ 111.0
  const intervalHr=intervalMin/60;

  return currClusters.map(curr=>{
    let best=null,bestDist=Infinity;
    for(const prev of prevClusters){
      const d=hav(curr.centroid.lat,curr.centroid.lng,prev.centroid.lat,prev.centroid.lng);
      if(d<bestDist){bestDist=d;best=prev;}
    }
    if(!best||bestDist>MAX_MATCH_KM)return{...curr,velocity:null};

    const dLat=(curr.centroid.lat-best.centroid.lat)/intervalHr; // deg/hr
    const dLng=(curr.centroid.lng-best.centroid.lng)/intervalHr; // deg/hr
    const dLatKm=dLat*LAT_KM;
    const dLngKm=dLng*LNG_KM;
    const speedKmh=Math.sqrt(dLatKm*dLatKm+dLngKm*dLngKm);

    // Sanity-check: implausible speeds → no velocity (sensor noise or cluster jump)
    if(speedKmh>SPEED_MAX)return{...curr,velocity:null};

    return{...curr,velocity:{dLat,dLng,speedKmh}};
  });
}
// Find the closest station within NEAREST_KM reporting intensity > NEAREST_MIN_I
function nearestWetStation(cells,lat,lng){
  let best=null,bestDist=Infinity;
  for(const c of cells){
    if((c.intensity||0)<NEAREST_MIN_I)continue;
    const d=hav(lat,lng,c.lat,c.lng);
    if(d<bestDist){bestDist=d;best=c;}
  }
  return best&&bestDist<=NEAREST_KM?{station:best,dist:bestDist}:null;
}

// Estimate drizzle clearing from intensity trend across history frames
function drizzleClearHint(lat,lng){
  if(historyFrames.length<2)return'';
  const s0=nearestWetStation(historyFrames[0].cells,lat,lng);
  const s1=nearestWetStation(historyFrames[Math.min(1,historyFrames.length-1)].cells,lat,lng);
  if(!s0||!s1)return'';
  const delta=s1.station.intensity-s0.station.intensity; // older minus newer
  if(delta>30)return' Intensity easing — may clear in 5–10 min.';
  if(delta>10)return' Gradually easing — may clear in 10–15 min.';
  if(delta<-20)return' Building — could get heavier.';
  return'';
}

function decide(lat,lng,clusters,cells=[]){
  // ── No clusters — nearest-station drizzle check ──────────────────────────
  if(!clusters.length){
    const wet=nearestWetStation(cells,lat,lng);
    if(wet){
      const km=wet.dist.toFixed(1);
      return{state:'WAIT',minutes:0,confidence:65,
        message:`Light drizzle detected ${km} km from your location. May reach you soon.`,storm:null};
    }
    return{state:'GO',minutes:999,confidence:90,
      message:"No rain at your location. You're clear to go.",storm:null};
  }

  let minT=Infinity,best=null,hasGoodVelocity=false;

  for(const c of clusters){
    const distToCenter=hav(lat,lng,c.centroid.lat,c.centroid.lng);
    const radiusKm=c.radiusKm||1;
    const isDrizzle=(c.avgI||100)<DRIZZLE_AVG_I;

    // ── User is inside this storm ──────────────────────────────────────────
    if(distToCenter<=radiusKm){
      const b=bearingDeg(lat,lng,c.centroid.lat,c.centroid.lng);
      let clearMsg='';
      let conf=isDrizzle?70:80;

      if(c.velocity&&c.velocity.speedKmh>=SPEED_MIN){
        const{dLat,dLng,speedKmh}=c.velocity;
        const toUserLat=lat-c.centroid.lat;
        const toUserLng=lng-c.centroid.lng;
        const movingAway=toUserLat*dLat+toUserLng*dLng<0;
        if(movingAway){
          // Time for storm edge to clear user: how far edge must travel = distToCenter + radiusKm?
          // Actually user is at distToCenter from centroid, edge is at radiusKm.
          // Edge must travel (radiusKm - distToCenter) more to reach user,
          // then another radiusKm to clear — approximate as 2*(radiusKm - distToCenter/2)/speed
          const remaining=radiusKm+distToCenter; // conservative: edge to user + user to far edge
          const clearMin=Math.round(remaining/speedKmh*60);
          clearMsg=` Moving away — should clear in about ${clearMin} min.`;
          conf=Math.min(conf+5,85);
        } else {
          clearMsg=' Storm is stationary or moving over you.';
        }
      } else {
        // No velocity — use history intensity trend
        const hint=drizzleClearHint(lat,lng);
        clearMsg=hint||' Keep an eye on it.';
      }

      const msg=isDrizzle
        ?`It's drizzling at your location right now.${clearMsg}`
        :`It's raining at your location right now.${clearMsg}`;
      return{state:'DELAY',minutes:0,confidence:conf,message:msg,
        storm:{bearing:b,direction:compass(b),edgeDistKm:0,radiusKm,centroid:c.centroid}};
    }

    // ── Storm outside — check if approaching ──────────────────────────────
    const edgeDist=distToCenter-radiusKm;

    let timeMin;
    if(c.velocity&&c.velocity.speedKmh>=SPEED_MIN){
      const{dLat,dLng,speedKmh}=c.velocity;
      const toUserLat=lat-c.centroid.lat;
      const toUserLng=lng-c.centroid.lng;
      // Dot product > 0 → storm centroid moving toward user
      const approaching=toUserLat*dLat+toUserLng*dLng>0;
      if(!approaching){timeMin=Infinity;continue;} // confirmed moving away — skip
      // Use measured speed, clamped to plausible range
      const speed=Math.max(SPEED_MIN,Math.min(speedKmh,SPEED_MAX));
      timeMin=(edgeDist/speed)*60;
      hasGoodVelocity=true;
    }else{
      // No velocity yet (first frame) — assume approaching at default speed (conservative)
      timeMin=(edgeDist/DEF_SPEED)*60;
    }

    if(timeMin<minT){minT=timeMin;best=c;}
  }

  // ── All clusters confirmed moving away ────────────────────────────────────
  if(minT===Infinity||!best){
    return{state:'GO',minutes:999,confidence:hasGoodVelocity?85:80,
      message:"Rain is moving away from your location. You're clear to go.",storm:null};
  }

  // ── Approaching storm ─────────────────────────────────────────────────────
  const m=Math.round(minT);
  const isDrizzle=(best.avgI||100)<DRIZZLE_AVG_I;
  // Confidence: velocity-tracked > default speed assumption; drizzle capped lower
  let conf=hasGoodVelocity?82:70;
  if(isDrizzle)conf=Math.min(conf,70);

  // Uncertainty range for message (±20% of time estimate, minimum ±3 min)
  const uncertainty=Math.max(3,Math.round(m*0.2));
  const rangeStr=hasGoodVelocity?` (${Math.max(1,m-uncertainty)}–${m+uncertainty} min range)`:' (estimated)';

  const b=bearingDeg(lat,lng,best.centroid.lat,best.centroid.lng);
  const storm={
    bearing:b,direction:compass(b),
    edgeDistKm:+(hav(lat,lng,best.centroid.lat,best.centroid.lng)-best.radiusKm).toFixed(1),
    radiusKm:best.radiusKm,centroid:best.centroid,
    speedKmh:best.velocity?.speedKmh??DEF_SPEED,
  };

  if(m<DELAY_T)return{state:'DELAY',minutes:m,confidence:conf,storm,
    message:isDrizzle
      ?`Light rain reaching your location in about ${m} min${rangeStr}.`
      :`Rain reaching your location in about ${m} min${rangeStr}. Stay covered.`};
  if(m<WAIT_T)return{state:'WAIT',minutes:m,confidence:conf,storm,
    message:isDrizzle
      ?`Light rain heading your way — about ${m} min out${rangeStr}.`
      :`Rain heading to your location — about ${m} min away${rangeStr}. Best to wait here.`};
  return{state:'GO',minutes:m,confidence:conf,storm,
    message:`Rain is ${m} min from your location${rangeStr}. Head out now.`};
}

// ── DATA FETCH ──────────────────────────────────────────────────────────────
async function fetchData(){
  try{
    const r=await fetch(NEA_URL,{signal:AbortSignal.timeout(8000)});
    if(!r.ok)throw 0;
    const j=await r.json();
    if(!j?.metadata?.stations)throw 0;
    const{metadata:{stations},items}=j;
    const ts=items[0]?.timestamp??new Date().toISOString();
    const map={};
    for(const s of stations)map[s.id]={lat:s.location.latitude,lng:s.location.longitude,intensity:0};
    for(const rd of(items[0]?.readings??[]))
      if(map[rd.station_id])map[rd.station_id].intensity=Math.min(255,Math.round((rd.value/MAX_MM)*255));
    return{cells:Object.values(map),source:'live',timestamp:ts};
  }catch{return{cells:mockCells(),source:'mock',timestamp:new Date().toISOString()};}
}
async function getLocation(){
  return new Promise(resolve=>{
    if(!navigator.geolocation)return resolve({lat:DEFAULT_LAT,lng:DEFAULT_LNG,fallback:true});
    navigator.geolocation.getCurrentPosition(
      p=>resolve({lat:p.coords.latitude,lng:p.coords.longitude,fallback:false}),
      ()=>resolve({lat:DEFAULT_LAT,lng:DEFAULT_LNG,fallback:true}),
      {timeout:8000,maximumAge:60000}
    );
  });
}
async function reverseGeocode(lat,lng){
  try{
    const r=await fetch(`${GEO_URL}?lat=${lat}&lon=${lng}&format=json&zoom=16&addressdetails=1`,
      {headers:{'User-Agent':'RainGo/1.0'},signal:AbortSignal.timeout(5000)});
    const j=await r.json();
    const a=j.address??{};
    const parts=[a.road||a.pedestrian||'',a.suburb||a.neighbourhood||''].filter(Boolean);
    return parts.length?parts.join(', '):(a.city??'Singapore');
  }catch{return'Singapore';}
}

function buildMockHistory(baseCells){
  // Build oldest→newest so velocity can be computed between adjacent frames
  const frames=[];
  let prevClusters=[];
  for(let i=MAX_HIST;i>=1;i--){
    const offset=i*0.013; // storm progressively further north in older frames
    const cells=baseCells.map(c=>c.intensity>I_THRESH?{...c,lat:c.lat+offset}:c);
    const rawClusters=clusterCells(cells);
    const clusters=prevClusters.length?computeVelocity(rawClusters,prevClusters,5):rawClusters;
    const decision=decide(userLat,userLng,clusters,cells);
    frames.unshift({cells,clusters,decision,
      timestamp:new Date(Date.now()-i*5*60*1000).toISOString(),
      label:`${i*5}m ago`});
    prevClusters=rawClusters;
  }
  return frames;
}

// ── CANVAS DRAWING ───────────────────────────────────────────────────────────
function toXY(lat,lng,W,H){
  return[(lng-LNG_MIN)/(LNG_MAX-LNG_MIN)*W,(LAT_MAX-lat)/(LAT_MAX-LAT_MIN)*H];
}

function drawPolygon(ctx,poly,W,H,fill,stroke,lw=1){
  ctx.beginPath();
  poly.forEach(([la,lo],i)=>{const[x,y]=toXY(la,lo,W,H);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
  ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();}
}

function drawRainClouds(ctx,cells,W,H){
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  for(const c of cells){
    if(c.intensity<6)continue;
    const[x,y]=toXY(c.lat,c.lng,W,H);
    const t=c.intensity/255;
    const r=(W*0.042)+(t*W*0.048);
    const g=ctx.createRadialGradient(x,y,0,x,y,r);
    if(t<0.30){
      g.addColorStop(0,`rgba(60,110,255,${0.32+t*0.8})`);
      g.addColorStop(0.45,`rgba(60,110,255,0.12)`);
      g.addColorStop(1,`rgba(60,110,255,0)`);
    }else if(t<0.65){
      const s=(t-0.30)/0.35;
      g.addColorStop(0,`rgba(255,${Math.round(220-s*80)},30,${0.45+t*0.35})`);
      g.addColorStop(0.45,`rgba(255,180,30,0.14)`);
      g.addColorStop(1,`rgba(255,180,30,0)`);
    }else{
      const s=(t-0.65)/0.35;
      g.addColorStop(0,`rgba(255,${Math.round(80-s*80)},30,${0.6+t*0.3})`);
      g.addColorStop(0.45,`rgba(255,50,30,0.18)`);
      g.addColorStop(1,`rgba(255,50,30,0)`);
    }
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

function drawStormCluster(ctx,c,W,H,pulse){
  const[cx,cy]=toXY(c.centroid.lat,c.centroid.lng,W,H);
  const kmPx=W/((LNG_MAX-LNG_MIN)*111.32*Math.cos(c.centroid.lat*Math.PI/180));
  const baseR=Math.max(10,c.radiusKm*kmPx);
  const glowR=baseR*(1.4+pulse*0.25);
  const og=ctx.createRadialGradient(cx,cy,baseR*0.6,cx,cy,glowR);
  og.addColorStop(0,`rgba(255,90,60,${0.18+pulse*0.06})`);
  og.addColorStop(1,'rgba(255,70,40,0)');
  ctx.fillStyle=og;ctx.beginPath();ctx.arc(cx,cy,glowR,0,Math.PI*2);ctx.fill();
  const ig=ctx.createRadialGradient(cx,cy,0,cx,cy,baseR);
  ig.addColorStop(0,'rgba(255,110,80,0.22)');
  ig.addColorStop(0.7,'rgba(255,80,60,0.12)');
  ig.addColorStop(1,'rgba(255,80,60,0.03)');
  ctx.fillStyle=ig;ctx.beginPath();ctx.arc(cx,cy,baseR,0,Math.PI*2);ctx.fill();
  ctx.save();ctx.setLineDash([4,3]);
  ctx.strokeStyle=`rgba(255,130,100,${0.55+pulse*0.25})`;ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(cx,cy,baseR,0,Math.PI*2);ctx.stroke();
  ctx.restore();
  ctx.fillStyle='rgba(255,160,140,0.92)';ctx.beginPath();ctx.arc(cx,cy,3,0,Math.PI*2);ctx.fill();
}

// Draw a dashed arrow showing storm projected path (15-min lookahead)
function drawVelocityArrow(ctx,c,W,H){
  if(!c.velocity||c.velocity.speedKmh<SPEED_MIN)return;
  const[cx,cy]=toXY(c.centroid.lat,c.centroid.lng,W,H);
  const LAT_KM=111.0,LNG_KM=111.32*Math.cos(1.35*Math.PI/180);
  // Project centroid 15 minutes forward
  const hr=0.25;
  const projLat=c.centroid.lat+c.velocity.dLat*hr;
  const projLng=c.centroid.lng+c.velocity.dLng*hr;
  const[px,py]=toXY(projLat,projLng,W,H);
  const dx=px-cx,dy=py-cy,mag=Math.sqrt(dx*dx+dy*dy);
  if(mag<8)return;
  const nx=dx/mag,ny=dy/mag;

  ctx.save();
  // Shaft
  ctx.setLineDash([5,4]);
  ctx.strokeStyle='rgba(255,210,80,0.55)';
  ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(px-nx*7,py-ny*7);ctx.stroke();
  // Arrowhead
  ctx.setLineDash([]);
  ctx.fillStyle='rgba(255,210,80,0.75)';
  ctx.beginPath();
  ctx.moveTo(px,py);
  ctx.lineTo(px-nx*9-ny*5,py-ny*9+nx*5);
  ctx.lineTo(px-nx*9+ny*5,py-ny*9-nx*5);
  ctx.closePath();ctx.fill();
  ctx.restore();
}
function drawMap(frame,uLat,uLng,pulse){
  const canvas=document.getElementById('map');
  const dpr=window.devicePixelRatio||1;
  const W=canvas.offsetWidth;
  if(!W)return;
  const H=Math.round(W*0.60);
  if(canvas.width!==W*dpr){canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.height=H+'px';}
  const ctx=canvas.getContext('2d');
  ctx.save();ctx.scale(dpr,dpr);

  // Sea background
  const sea=ctx.createLinearGradient(0,0,W,H);
  sea.addColorStop(0,'#06091a');sea.addColorStop(1,'#0a0f22');
  ctx.fillStyle=sea;ctx.fillRect(0,0,W,H);

  // Subtle lat/lng grid
  ctx.strokeStyle='rgba(255,255,255,0.028)';ctx.lineWidth=.5;
  for(let la=1.15;la<=1.50;la+=0.05){const[,y]=toXY(la,LNG_MIN,W,H);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  for(let lo=103.55;lo<=104.15;lo+=0.05){const[x]=toXY(LAT_MIN,lo,W,H);ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}

  // Island fill: slightly lighter than sea so landmass reads clearly
  drawPolygon(ctx,SG,W,H,'rgba(22,34,58,0.95)','rgba(60,100,175,0.6)',1.4);
  drawPolygon(ctx,SENTOSA,W,H,'rgba(22,34,58,0.9)','rgba(60,100,175,0.45)',1);
  drawPolygon(ctx,JURONG_ISLAND,W,H,'rgba(22,34,58,0.85)','rgba(60,100,175,0.35)',0.8);

  // Rain cloud blobs (additive blending)
  drawRainClouds(ctx,frame.cells,W,H);

  // Storm cluster glows
  for(const c of frame.clusters)drawStormCluster(ctx,c,W,H,pulse);
  for(const c of frame.clusters)drawVelocityArrow(ctx,c,W,H);

  // User location dot
  const[ux,uy]=toXY(uLat,uLng,W,H);
  ctx.beginPath();ctx.arc(ux,uy,8+pulse*7,0,Math.PI*2);
  ctx.fillStyle=`rgba(255,255,255,${0.15*(1-pulse)})`;ctx.fill();
  ctx.beginPath();ctx.arc(ux,uy,6,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,0.25)';ctx.fill();
  ctx.beginPath();ctx.arc(ux,uy,4,0,Math.PI*2);
  ctx.fillStyle='#fff';ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=1;ctx.stroke();
  ctx.font=`bold 8.5px -apple-system,sans-serif`;
  ctx.fillStyle='rgba(255,255,255,0.7)';ctx.textAlign='center';
  ctx.fillText('You',ux,uy+15);

  // Direction line to nearest storm
  if(frame.decision?.storm?.centroid){
    const sc=frame.decision.storm.centroid;
    const[sx,sy]=toXY(sc.lat,sc.lng,W,H);
    const dx=sx-ux,dy=sy-uy,mag=Math.sqrt(dx*dx+dy*dy);
    if(mag>20){
      const nx=dx/mag,ny=dy/mag;
      ctx.save();ctx.setLineDash([3,4]);
      ctx.strokeStyle='rgba(255,255,255,0.18)';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(ux+nx*8,uy+ny*8);ctx.lineTo(sx-nx*12,sy-ny*12);
      ctx.stroke();ctx.restore();
    }
  }

  // Compass rose (bottom-right)
  const cr=10,cpx=W-16,cpy=H-16;
  ctx.font='7.5px sans-serif';ctx.fillStyle='rgba(255,255,255,0.28)';ctx.textAlign='center';
  ctx.fillText('N',cpx,cpy-cr-1);ctx.fillText('S',cpx,cpy+cr+8);
  ctx.fillText('W',cpx-cr-4,cpy+3);ctx.fillText('E',cpx+cr+4,cpy+3);
  ctx.beginPath();ctx.arc(cpx,cpy,cr*.35,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,0.18)';ctx.fill();

  ctx.restore();
}

// ── ANIMATION LOOP ───────────────────────────────────────────────────────────
function startAnim(){
  if(mapRaf)cancelAnimationFrame(mapRaf);
  function tick(){
    pulseT=(pulseT+0.015)%1;
    const frame=viewingIdx===null?liveFrame:historyFrames[viewingIdx];
    if(frame)drawMap(frame,userLat,userLng,pulseT);
    mapRaf=requestAnimationFrame(tick);
  }tick();
}

// ── HISTORY UI ───────────────────────────────────────────────────────────────
function updateTimeline(){
  const track=document.getElementById('tl-track');
  track.innerHTML='';
  historyFrames.forEach((f,i)=>{
    const div=document.createElement('div');div.className='tldot'+(i===viewingIdx?' active':'');
    const mins=Math.round((Date.now()-new Date(f.timestamp))/60000);
    div.innerHTML=`<div class="tldot-circle"></div><div class="tldot-lbl">${mins}m</div>`;
    div.addEventListener('click',()=>showFrame(i));
    track.appendChild(div);
  });
  document.getElementById('tl-live').className='tl-live'+(viewingIdx===null?' active':'');
}

function showFrame(idx){
  stopPlay();viewingIdx=idx;updateTimeline();
  const frame=historyFrames[idx];
  const banner=document.getElementById('history-banner');
  const mins=Math.round((Date.now()-new Date(frame.timestamp))/60000);
  banner.textContent=`◷ Viewing radar from ${mins} minutes ago`;banner.classList.add('on');
  updateDecisionUI(frame.decision,frame.clusters,frame.source,frame.timestamp);
}

function showLive(){
  stopPlay();viewingIdx=null;
  document.getElementById('history-banner').classList.remove('on');
  updateTimeline();
  if(liveFrame)updateDecisionUI(liveFrame.decision,liveFrame.clusters,liveFrame.source,liveFrame.timestamp);
}

function startPlay(){
  if(isPlaying){stopPlay();return;}
  isPlaying=true;document.getElementById('tl-play').textContent='⏸';
  let i=historyFrames.length-1;
  function next(){
    if(!isPlaying)return;
    if(i<0){showLive();document.getElementById('tl-play').textContent='▶';isPlaying=false;return;}
    viewingIdx=i;updateTimeline();
    const frame=historyFrames[i];
    const banner=document.getElementById('history-banner');
    const mins=Math.round((Date.now()-new Date(frame.timestamp))/60000);
    banner.textContent=`◷ Viewing radar from ${mins} minutes ago`;banner.classList.add('on');
    updateDecisionUI(frame.decision,frame.clusters,frame.source,frame.timestamp);
    i--;playTimer=setTimeout(next,750);
  }next();
}
function stopPlay(){
  isPlaying=false;document.getElementById('tl-play').textContent='▶';clearTimeout(playTimer);
}

// ── FLASH ON STATE CHANGE ────────────────────────────────────────────────────
function triggerFlash(){
  const el=document.getElementById('flash');
  el.style.transition='none';
  el.style.opacity='0.28';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    el.style.transition='opacity .55s ease';
    el.style.opacity='0';
  }));
}

// ── TOAST ────────────────────────────────────────────────────────────────────
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

// ── AUTO-REFRESH COUNTDOWN ───────────────────────────────────────────────────
function startCountdown(){
  clearInterval(countdownInterval);
  countdownSec=REFRESH_INTERVAL;
  countdownInterval=setInterval(()=>{
    countdownSec=Math.max(0,countdownSec-1);
    const m=Math.floor(countdownSec/60),s=countdownSec%60;
    document.getElementById('countdown').textContent=
      countdownSec>0?`Next update in ${m}:${String(s).padStart(2,'0')}`:'';
  },1000);
}

// ── SHARE ────────────────────────────────────────────────────────────────────
function buildShareText(){
  if(!liveFrame)return'Check RainGo for rain conditions in Singapore.';
  const d=liveFrame.decision, loc=locationLabel||'Singapore';
  if(d.state==='GO')    return`RainGo ✅ Safe to go at ${loc} — no rain nearby. (${d.confidence}% confidence)`;
  if(d.state==='WAIT')  return`RainGo ⏳ Rain in ${d.minutes} min at ${loc}. Best to wait. (${d.confidence}% confidence)`;
  if(d.minutes===0)     return`RainGo 🌧 It's raining at ${loc} right now.`;
  return`RainGo 🌧 Rain hits ${loc} in ${d.minutes} min — delay your trip. (${d.confidence}% confidence)`;
}
async function doShare(){
  const text=buildShareText();
  if(navigator.share){
    try{await navigator.share({title:'RainGo',text});return;}catch{}
  }
  try{await navigator.clipboard.writeText(text);showToast('Copied to clipboard');}
  catch{showToast('Unable to copy');}
}

// ── NOTIFICATIONS ────────────────────────────────────────────────────────────
async function toggleAlert(){
  if(alertScheduled){cancelAlert();return;}
  if(!('Notification' in window)){showToast('Notifications not supported in this browser');return;}
  const perm=await Notification.requestPermission();
  if(perm!=='granted'){showToast('Please allow notifications in your browser settings');return;}
  const minutes=Math.max(5,liveFrame?.decision?.minutes??20);
  clearTimeout(alertTimeout);
  alertTimeout=setTimeout(()=>{
    try{new Notification('RainGo — time to check',{body:'Tap to see if it\'s safe to head out now.',icon:'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><text y="26" font-size="26">🌦️</text></svg>'});}
    catch{}
    alertScheduled=false;updateAlertButton();
  },minutes*60*1000);
  alertScheduled=true;updateAlertButton();
  showToast(`Reminder set for ${minutes} min from now`);
}
function cancelAlert(){
  clearTimeout(alertTimeout);alertScheduled=false;updateAlertButton();
  showToast('Reminder cancelled');
}
function updateAlertButton(){
  const btn=document.getElementById('alert-btn');
  if(alertScheduled){
    btn.textContent='🔕 Cancel reminder';
  }else{
    btn.innerHTML='🔔 Remind me when safe';
  }
}

// ── RENDER ───────────────────────────────────────────────────────────────────
const ICONS={GO:'☀️',WAIT:'🌦️',DELAY:'⛈️'};
function hl(d){
  if(d.state==='GO')return"You're clear to go";
  if(d.state==='WAIT'){
    if(d.minutes===0)return'Drizzle nearby';
    return`Rain in ${d.minutes} min`;
  }
  if(d.minutes===0)return'Raining at your location';
  return`Rain arriving in ${d.minutes} min`;
}

function renderLoading(msg){
  document.getElementById('bg').className='';
  document.getElementById('r1').className='ring';
  document.getElementById('r2').className='ring lag';
  document.getElementById('content').innerHTML=`<div class="spin"></div><div class="sub">${msg}</div>`;
  document.getElementById('btn').disabled=true;
  document.getElementById('age').textContent='';
  document.getElementById('pred-strip').classList.remove('on');
  document.getElementById('alert-btn').classList.remove('on');
  document.getElementById('share-btn').classList.remove('on');
}

function updateDecisionUI(decision,clusters,source,timestamp){
  // Background + rings
  document.getElementById('bg').className=decision.state.toLowerCase();
  const rings=decision.state!=='GO';
  document.getElementById('r1').className='ring'+(rings?' on':'');
  document.getElementById('r2').className='ring lag'+(rings?' on':'');

  // Source badge
  const sb=document.getElementById('src-badge');
  sb.textContent=source==='live'?'NEA LIVE':'NEA DEMO';
  sb.style.color=source==='live'?'rgba(122,226,140,.85)':'rgba(255,209,102,.75)';

  // Flash if state changed
  if(prevState&&prevState!==decision.state)triggerFlash();
  prevState=decision.state;

  // Decision card
  const showNum=(decision.state==='WAIT'||decision.state==='DELAY')&&decision.minutes>0&&decision.minutes<999;
  document.getElementById('content').innerHTML=`
    <div class="icon">${ICONS[decision.state]??'🌫️'}</div>
    ${showNum?`<div class="big-num">${decision.minutes}</div><div class="big-unit">minutes</div>`:''}
    <div class="headline">${hl(decision)}</div>
    <div class="sub">${decision.message}</div>
    <div class="conf-pill">
      <span class="cdot ${decision.confidence>=80?'hi':'lo'}"></span>
      ${decision.confidence}% confidence
    </div>`;

  // Prediction strip
  const strip=document.getElementById('pred-strip');
  if(decision.storm&&decision.state!=='GO'){
    strip.classList.add('on');
    document.getElementById('p-time').textContent=
      decision.minutes>0&&decision.minutes<999?`${decision.minutes} min`:'Now';
    document.getElementById('p-dir').innerHTML=
      `${arrow(decision.storm.bearing)}&nbsp;${decision.storm.direction}`;
    document.getElementById('p-size').textContent=
      `${Math.round(decision.storm.radiusKm*2)} km`;
  }else{strip.classList.remove('on');}

  // Age
  const age=Math.round((Date.now()-new Date(timestamp))/1000);
  document.getElementById('age').textContent=
    age<60?'Radar updated just now':`Radar updated ${Math.floor(age/60)} min ago`;
  document.getElementById('btn').disabled=false;

  // Alert button — show only when WAIT or DELAY
  const alertBtn=document.getElementById('alert-btn');
  if(decision.state!=='GO'){alertBtn.classList.add('on');}
  else{alertBtn.classList.remove('on');if(alertScheduled)cancelAlert();}
  updateAlertButton();

  // Share button — always show once we have data
  document.getElementById('share-btn').classList.add('on');

  // Debug
  document.getElementById('dbg-pre').textContent=JSON.stringify({
    location:{lat:+userLat.toFixed(5),lng:+userLng.toFixed(5),label:locationLabel},
    source,timestamp,
    activeClusters:clusters.length,
    clusters:clusters.map(c=>({centroid:{lat:+c.centroid.lat.toFixed(4),lng:+c.centroid.lng.toFixed(4)},
      radiusKm:+c.radiusKm.toFixed(1),avgIntensity:Math.round(c.avgI),stations:c.points.length})),
    decision,
  },null,2);
}

// ── REFRESH ──────────────────────────────────────────────────────────────────
let refreshTimer=null;
async function refresh(){
  clearTimeout(refreshTimer);stopPlay();viewingIdx=null;

  renderLoading('Getting your location…');
  const pos=await getLocation();
  userLat=pos.lat;userLng=pos.lng;

  renderLoading('Checking rain radar…');
  const[label,radarData]=await Promise.all([reverseGeocode(userLat,userLng),fetchData()]);
  locationLabel=pos.fallback?'Singapore (location unavailable)':label;
  document.getElementById('loc-text').textContent=locationLabel;

  const cells=radarData.cells;
  const rawClusters=clusterCells(cells);
  // Compute velocity by matching against previous live frame's clusters
  const prevClusters=liveFrame?.clusters??[];
  const intervalMin=liveFrame
    ?Math.max(1,Math.round((Date.now()-new Date(liveFrame.timestamp))/60000))
    :5;
  const clusters=computeVelocity(rawClusters,prevClusters,intervalMin);
  let decision=decide(userLat,userLng,clusters,cells);
  // "Rain cleared" transition: override message when DELAY→GO
  if(prevState==='DELAY'&&decision.state==='GO'){
    decision={...decision,message:"Rain has just cleared from your location. You're good to go."};
  }

  if(liveFrame){
    historyFrames.unshift(liveFrame);
    if(historyFrames.length>MAX_HIST)historyFrames.pop();
  }
  liveFrame={cells,clusters,decision,source:radarData.source,timestamp:radarData.timestamp};

  if(historyFrames.length===0&&radarData.source==='mock'){
    historyFrames=buildMockHistory(cells);
  }

  updateDecisionUI(decision,clusters,radarData.source,radarData.timestamp);
  document.getElementById('history-banner').classList.remove('on');
  updateTimeline();
  startAnim();
  startCountdown();

  refreshTimer=setTimeout(refresh,REFRESH_INTERVAL*1000);
}

// ── EVENTS ───────────────────────────────────────────────────────────────────
document.getElementById('tl-play').addEventListener('click',startPlay);
document.getElementById('tl-live').addEventListener('click',showLive);
document.getElementById('btn').addEventListener('click',()=>{if(alertScheduled)cancelAlert();refresh();});
document.getElementById('alert-btn').addEventListener('click',toggleAlert);
document.getElementById('share-btn').addEventListener('click',doShare);
document.getElementById('dbg-btn').addEventListener('click',()=>document.getElementById('debug').classList.toggle('open'));
window.addEventListener('resize',()=>{
  const frame=viewingIdx===null?liveFrame:historyFrames[viewingIdx];
  if(frame)drawMap(frame,userLat,userLng,pulseT);
});

refresh();
</script>
