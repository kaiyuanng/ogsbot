<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RainGo</title>
<style>
:root {
  --go-1:#0D9E5A; --go-2:#0A7A44;
  --wait-1:#E8920A; --wait-2:#C47208;
  --delay-1:#D42B2B; --delay-2:#A01F1F;
  --idle-1:#1C1C2E; --idle-2:#111120;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',system-ui,sans-serif;
  height:100vh;overflow:hidden;color:#fff;
}
#bg{
  width:100%;height:100%;
  background:linear-gradient(135deg,var(--idle-1),var(--idle-2));
  transition:background 0.5s ease;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;
}
#bg.go    {background:linear-gradient(135deg,var(--go-1),var(--go-2))}
#bg.wait  {background:linear-gradient(135deg,var(--wait-1),var(--wait-2))}
#bg.delay {background:linear-gradient(135deg,var(--delay-1),var(--delay-2))}

/* ── Pulse rings ── */
.ring{
  position:absolute;width:320px;height:320px;border-radius:50%;
  border:1.5px solid rgba(255,255,255,.3);opacity:0;display:none;
}
.ring.on{display:block;animation:expand 2.4s ease-out infinite}
.ring.on.lag{animation-delay:.85s}
@keyframes expand{
  0%  {transform:scale(.55);opacity:.35}
  100%{transform:scale(1.55);opacity:0}
}

/* ── Main content ── */
#content{
  display:flex;flex-direction:column;align-items:center;gap:26px;
  padding:0 28px;text-align:center;z-index:1;flex:1;justify-content:center;
}
.icon{font-size:72px;line-height:1;filter:drop-shadow(0 4px 14px rgba(0,0,0,.25))}
.big-num{
  font-size:80px;font-weight:800;letter-spacing:-2px;line-height:1;
  text-shadow:0 2px 14px rgba(0,0,0,.2);
}
.big-unit{font-size:15px;opacity:.55;margin-top:-8px;letter-spacing:.5px;text-transform:uppercase}
.headline{
  font-size:clamp(30px,7.5vw,46px);font-weight:700;letter-spacing:-.5px;line-height:1.1;
  text-shadow:0 2px 8px rgba(0,0,0,.15);
}
.sub{font-size:16px;opacity:.82;max-width:300px;line-height:1.55}
.pill{
  display:flex;align-items:center;gap:7px;padding:6px 14px;
  background:rgba(255,255,255,.12);border-radius:100px;
  font-size:13px;font-weight:500;opacity:.68;
}
.dot{width:7px;height:7px;border-radius:50%}
.dot.hi{background:#7AE28C} .dot.lo{background:#FFD166}

/* ── Spinner ── */
.spin{
  width:42px;height:42px;border:3px solid rgba(255,255,255,.22);
  border-top-color:#fff;border-radius:50%;animation:rot .75s linear infinite;
}
@keyframes rot{to{transform:rotate(360deg)}}

/* ── Footer ── */
#footer{
  width:100%;padding:0 32px 46px;
  display:flex;flex-direction:column;align-items:center;gap:9px;z-index:1;
}
#age{font-size:11.5px;opacity:.38;letter-spacing:.2px}
#loc{font-size:11px;opacity:.28;font-variant-numeric:tabular-nums}
#btn{
  width:100%;max-width:360px;padding:17px;
  background:rgba(255,255,255,.18);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.2);border-radius:16px;
  color:#fff;font-size:17px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:opacity .2s,background .2s;font-family:inherit;
}
#btn:disabled{opacity:.35;cursor:default}
#btn:not(:disabled):hover{background:rgba(255,255,255,.25)}

/* ── Badges ── */
.badge{
  position:fixed;top:14px;
  background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.12);
  border-radius:8px;font-size:10.5px;padding:4px 9px;z-index:20;
  letter-spacing:.4px;font-family:inherit;cursor:default;
}
#src-badge{left:14px}
#dbg-btn{right:14px;cursor:pointer;color:rgba(255,255,255,.38)}
#dbg-btn:hover{color:rgba(255,255,255,.7)}

/* ── Debug panel ── */
#debug{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(0,0,0,.88);backdrop-filter:blur(10px);
  padding:12px 16px 20px;font-size:11px;
  font-family:'SF Mono','Fira Code',monospace;
  max-height:220px;overflow-y:auto;display:none;z-index:10;
  border-top:1px solid rgba(255,255,255,.1);
}
#debug.open{display:block}
#debug pre{color:#adf;line-height:1.65;white-space:pre-wrap}
</style>
</head>
<body>
<div id="bg">
  <div class="ring" id="r1"></div>
  <div class="ring lag" id="r2"></div>
  <div id="content">
    <div class="spin"></div>
    <div class="sub">Checking NEA rain radar…</div>
  </div>
  <div id="footer">
    <div id="age"></div>
    <div id="loc"></div>
    <button id="btn" disabled>↺&nbsp; Check again</button>
  </div>
</div>

<div class="badge" id="src-badge">NEA</div>
<button class="badge" id="dbg-btn">debug</button>
<div id="debug"><pre id="dbg-pre"></pre></div>

<script>
'use strict';

// ─── CONFIG — change these coordinates to test any Singapore location ──────
const LAT = 1.2657294;
const LNG = 103.8227098;

// ─── CONSTANTS ─────────────────────────────────────────────────────────────
const NEA_URL       = 'https://api.data.gov.sg/v1/environment/rainfall';
const MAX_MM        = 5;        // 5 mm/5min = intensity 255
const I_THRESH      = 60;       // filter threshold
const EPS_KM        = 5;        // DBSCAN neighbourhood radius
const MIN_PTS       = 2;        // DBSCAN minimum cluster size
const DEF_SPEED     = 20;       // km/h assumed when no velocity data
const DELAY_THRESH  = 10;       // minutes
const WAIT_THRESH   = 25;       // minutes

// ─── HAVERSINE ─────────────────────────────────────────────────────────────
function hav(a1,o1,a2,o2){
  const R=6371,r=Math.PI/180,da=(a2-a1)*r,do_=(o2-o1)*r;
  const x=Math.sin(da/2)**2+Math.cos(a1*r)*Math.cos(a2*r)*Math.sin(do_/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// ─── DBSCAN ────────────────────────────────────────────────────────────────
function dbscan(pts,eps,min){
  const n=pts.length,L=new Array(n).fill(0);let id=1;
  const nb=i=>{const r=[];for(let j=0;j<n;j++)if(j!==i&&hav(pts[i].lat,pts[i].lng,pts[j].lat,pts[j].lng)<=eps)r.push(j);return r;};
  for(let i=0;i<n;i++){
    if(L[i]!==0)continue;
    const s=nb(i);
    if(s.length+1<min){L[i]=-1;continue;}
    L[i]=id;const q=new Set(s);
    for(const j of q){if(L[j]===-1)L[j]=id;if(L[j]!==0)continue;L[j]=id;const jn=nb(j);if(jn.length+1>=min)jn.forEach(r=>q.add(r));}
    id++;
  }
  const out=[];for(let c=1;c<id;c++)out.push(pts.filter((_,i)=>L[i]===c));
  return out;
}

// ─── CLUSTERING ────────────────────────────────────────────────────────────
function cluster(cells){
  const active=cells.filter(c=>c.intensity>I_THRESH);
  if(!active.length)return[];
  return dbscan(active,EPS_KM,MIN_PTS).map(pts=>{
    const lat=pts.reduce((s,p)=>s+p.lat,0)/pts.length;
    const lng=pts.reduce((s,p)=>s+p.lng,0)/pts.length;
    const maxI=Math.max(...pts.map(p=>p.intensity));
    const avgI=pts.reduce((s,p)=>s+p.intensity,0)/pts.length;
    const r=Math.max(1,...pts.map(p=>hav(lat,lng,p.lat,p.lng)));
    return{centroid:{lat,lng},points:pts,maxI,avgI,radiusKm:r};
  });
}

// ─── DECISION ENGINE ───────────────────────────────────────────────────────
function decide(lat,lng,clusters){
  if(!clusters.length)
    return{state:'GO',minutes:999,confidence:90,message:'No rain nearby. Safe to go!'};

  let minT=Infinity,best=null,weak=true;
  for(const c of clusters){
    const d=hav(lat,lng,c.centroid.lat,c.centroid.lng);
    if(d<=c.radiusKm)
      return{state:'DELAY',minutes:0,confidence:80,message:"You're in the rain right now. Wait it out!"};
    if(c.avgI>80)weak=false;
    const t=((d-c.radiusKm)/DEF_SPEED)*60;
    if(t<minT){minT=t;best=c;}
  }
  if(minT===Infinity)
    return{state:'GO',minutes:999,confidence:80,message:'Rain moving away. Safe to go!'};
  const m=Math.round(minT),conf=weak?70:80;
  if(m<DELAY_THRESH)return{state:'DELAY',minutes:m,confidence:conf,message:`Rain arrives in ~${m} min. Better to wait.`};
  if(m<WAIT_THRESH) return{state:'WAIT', minutes:m,confidence:conf,message:`Rain expected in ~${m} min. Wait a bit.`};
  return{state:'GO',minutes:m,confidence:conf,message:`Rain is ${m} min away. Safe to go!`};
}

// ─── FETCH — live NEA → mock fallback ──────────────────────────────────────
async function fetchData(){
  try{
    const res=await fetch(NEA_URL,{signal:AbortSignal.timeout(8000)});
    if(!res.ok)throw 0;
    const j=await res.json();
    if(!j?.metadata?.stations)throw 0;
    const {metadata:{stations},items}=j;
    const ts=items[0]?.timestamp??new Date().toISOString();
    const map={};
    for(const s of stations)map[s.id]={lat:s.location.latitude,lng:s.location.longitude,intensity:0};
    for(const r of(items[0]?.readings??[]))
      if(map[r.station_id])map[r.station_id].intensity=Math.min(255,Math.round((r.value/MAX_MM)*255));
    return{cells:Object.values(map),source:'live',timestamp:ts};
  }catch{
    return{cells:mockCells(),source:'mock',timestamp:new Date().toISOString()};
  }
}

// ─── MOCK DATA — storm ~18 km north, WAIT ~20 min scenario ─────────────────
function mockCells(){
  return[
    // User's area (south) — dry
    {lat:1.265,lng:103.823,intensity:0}, // Harbourfront / Telok Blangah ← USER
    {lat:1.271,lng:103.796,intensity:0}, // Pasir Panjang
    {lat:1.279,lng:103.851,intensity:0}, // Marina Bay
    {lat:1.249,lng:103.830,intensity:0}, // Sentosa
    {lat:1.294,lng:103.786,intensity:0}, // Queenstown
    {lat:1.312,lng:103.765,intensity:0}, // West Coast
    {lat:1.281,lng:103.800,intensity:0}, // Labrador
    // Light drizzle mid-island
    {lat:1.335,lng:103.780,intensity:28}, // Clementi
    {lat:1.320,lng:103.810,intensity:18}, // Buona Vista
    {lat:1.353,lng:103.835,intensity:42}, // Bishan
    {lat:1.345,lng:103.850,intensity:31}, // Toa Payoh
    // Active storm cluster north (~18 km away, approaching)
    {lat:1.415,lng:103.830,intensity:190}, // Yishun
    {lat:1.405,lng:103.815,intensity:215}, // Sembawang
    {lat:1.398,lng:103.842,intensity:195}, // Yishun East
    {lat:1.423,lng:103.836,intensity:175}, // Canberra
    {lat:1.410,lng:103.800,intensity:145}, // Sembawang West
    {lat:1.438,lng:103.789,intensity:88},  // Woodlands
    {lat:1.427,lng:103.770,intensity:82},  // Kranji
    // Dry east
    {lat:1.350,lng:103.957,intensity:0},  // Tampines
    {lat:1.364,lng:103.992,intensity:0},  // Changi
    {lat:1.380,lng:103.920,intensity:0},  // Punggol
    {lat:1.369,lng:103.845,intensity:5},  // Ang Mo Kio
    {lat:1.349,lng:103.937,intensity:0},  // Pasir Ris
  ];
}

// ─── UI HELPERS ────────────────────────────────────────────────────────────
const ICONS={GO:'☀️',WAIT:'🌦️',DELAY:'⛈️'};
function hl(d){
  if(d.state==='GO')   return'Safe to go now';
  if(d.state==='WAIT') return d.minutes<999?`Wait ${d.minutes} minutes`:'Wait a while';
  if(d.state==='DELAY')return d.minutes===0?"It's raining now":`Rain in ${d.minutes} min`;
  return'—';
}

// ─── RENDER ────────────────────────────────────────────────────────────────
let timer=null;
function render({loading,decision,clusters=[],source,timestamp}){
  const bg=document.getElementById('bg');
  const con=document.getElementById('content');
  const r1=document.getElementById('r1');
  const r2=document.getElementById('r2');
  const age=document.getElementById('age');
  const loc=document.getElementById('loc');
  const btn=document.getElementById('btn');
  const sb=document.getElementById('src-badge');

  bg.className=loading?'':(decision?.state?.toLowerCase()??'');
  const rings=!loading&&decision?.state!=='GO';
  r1.className='ring'+(rings?' on':'');
  r2.className='ring lag'+(rings?' on':'');

  sb.textContent=source==='live'?'NEA LIVE':'NEA DEMO';
  sb.style.color=source==='live'?'rgba(122,226,140,.75)':'rgba(255,209,102,.65)';

  loc.textContent=`${LAT.toFixed(4)}° N, ${LNG.toFixed(4)}° E  ·  Singapore`;

  if(loading){
    con.innerHTML=`<div class="spin"></div><div class="sub">Checking NEA rain radar…</div>`;
    btn.disabled=true; age.textContent='';
    return;
  }
  if(!decision)return;

  const isWait=decision.state==='WAIT'&&decision.minutes>0&&decision.minutes<999;
  const isDelay=decision.state==='DELAY'&&decision.minutes>0;
  const showNum=isWait||isDelay;

  con.innerHTML=`
    <div class="icon">${ICONS[decision.state]??'🌫️'}</div>
    ${showNum?`<div class="big-num">${decision.minutes}</div><div class="big-unit">minutes</div>`:''}
    <div class="headline">${hl(decision)}</div>
    <div class="sub">${decision.message}</div>
    <div class="pill">
      <span class="dot ${decision.confidence>=80?'hi':'lo'}"></span>
      ${decision.confidence}% confidence
    </div>`;

  const ageSec=Math.round((Date.now()-new Date(timestamp))/1000);
  age.textContent=ageSec<60?'Radar updated just now':`Radar updated ${Math.floor(ageSec/60)} min ago`;
  btn.disabled=false;

  document.getElementById('dbg-pre').textContent=JSON.stringify({
    checked:{lat:LAT,lng:LNG},
    source,timestamp,
    activeClusters:clusters.length,
    clusters:clusters.map(c=>({
      centroid:{lat:+c.centroid.lat.toFixed(4),lng:+c.centroid.lng.toFixed(4)},
      radiusKm:+c.radiusKm.toFixed(1),
      avgIntensity:Math.round(c.avgI),
      stations:c.points.length,
    })),
    decision,
  },null,2);
}

// ─── REFRESH ───────────────────────────────────────────────────────────────
async function refresh(){
  clearTimeout(timer);
  render({loading:true});
  const {cells,source,timestamp}=await fetchData();
  const clusters=cluster(cells);
  const decision=decide(LAT,LNG,clusters);
  render({loading:false,decision,clusters,source,timestamp});
  timer=setTimeout(refresh,5*60*1000); // auto-refresh every 5 min
}

document.getElementById('dbg-btn').addEventListener('click',()=>{
  document.getElementById('debug').classList.toggle('open');
});
document.getElementById('btn').addEventListener('click',refresh);
refresh();
</script>
</body>
</html>
