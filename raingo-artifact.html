<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RainGo</title>
<style>
:root{--go-1:#0D9E5A;--go-2:#0A7A44;--wait-1:#E8920A;--wait-2:#C47208;--delay-1:#D42B2B;--delay-2:#A01F1F;--idle-1:#1C1C2E;--idle-2:#111120}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',system-ui,sans-serif;color:#fff}
body{min-height:100vh;overflow-y:auto;overflow-x:hidden}
#bg{min-height:100vh;background:linear-gradient(145deg,var(--idle-1),var(--idle-2));transition:background .5s ease;display:flex;flex-direction:column;align-items:center;position:relative;padding-bottom:32px}
#bg.go   {background:linear-gradient(145deg,var(--go-1),var(--go-2))}
#bg.wait {background:linear-gradient(145deg,var(--wait-1),var(--wait-2))}
#bg.delay{background:linear-gradient(145deg,var(--delay-1),var(--delay-2))}

/* pulse rings */
.ring{position:absolute;top:140px;left:50%;transform:translateX(-50%);width:260px;height:260px;border-radius:50%;border:1.5px solid rgba(255,255,255,.25);opacity:0;display:none;pointer-events:none}
.ring.on{display:block;animation:expand 2.5s ease-out infinite}
.ring.on.lag{animation-delay:1s}
@keyframes expand{0%{transform:translateX(-50%) scale(.5);opacity:.3}100%{transform:translateX(-50%) scale(1.7);opacity:0}}

/* decision card */
#content{display:flex;flex-direction:column;align-items:center;gap:20px;padding:72px 28px 24px;text-align:center;z-index:1;width:100%;max-width:420px}
.icon{font-size:64px;line-height:1;filter:drop-shadow(0 4px 14px rgba(0,0,0,.3))}
.big-num{font-size:78px;font-weight:800;letter-spacing:-2px;line-height:1;text-shadow:0 2px 16px rgba(0,0,0,.25)}
.big-unit{font-size:13px;opacity:.5;margin-top:-10px;letter-spacing:.7px;text-transform:uppercase}
.headline{font-size:clamp(26px,7vw,42px);font-weight:700;letter-spacing:-.5px;line-height:1.1;text-shadow:0 2px 8px rgba(0,0,0,.15)}
.sub{font-size:15px;opacity:.8;max-width:290px;line-height:1.6}
.conf-pill{display:flex;align-items:center;gap:7px;padding:6px 14px;background:rgba(255,255,255,.12);border-radius:100px;font-size:12px;font-weight:500;opacity:.65}
.cdot{width:7px;height:7px;border-radius:50%}
.cdot.hi{background:#7AE28C}.cdot.lo{background:#FFD166}

/* prediction strip */
#pred-strip{width:calc(100% - 32px);max-width:380px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:13px 16px;display:none;flex-direction:row;justify-content:space-around;backdrop-filter:blur(10px);z-index:1}
#pred-strip.on{display:flex}
.pstat{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1}
.pval{font-size:18px;font-weight:700}
.plbl{font-size:9px;opacity:.45;letter-spacing:.5px;text-transform:uppercase}
.pdiv{width:1px;background:rgba(255,255,255,.12);align-self:stretch}

/* spinner */
.spin{width:40px;height:40px;border:3px solid rgba(255,255,255,.18);border-top-color:#fff;border-radius:50%;animation:rot .75s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* map section */
#map-wrap{width:calc(100% - 32px);max-width:420px;z-index:1;margin-top:8px}
#map-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;padding:0 2px}
#map-title{font-size:10px;font-weight:600;opacity:.4;letter-spacing:.9px;text-transform:uppercase}
#map-legend{display:flex;gap:8px}
.leg{display:flex;align-items:center;gap:3px;font-size:9px;opacity:.38}
.leg-dot{width:7px;height:7px;border-radius:50%}
canvas#map{width:100%;border-radius:14px;display:block;border:1px solid rgba(255,255,255,.07)}

/* timeline */
#timeline{display:flex;align-items:center;gap:6px;padding:10px 2px 0;width:100%}
#tl-play{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .2s}
#tl-play:hover{background:rgba(255,255,255,.25)}
#tl-track{flex:1;display:flex;align-items:center;gap:6px;overflow:hidden}
.tldot{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;flex:1}
.tldot-circle{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25);transition:all .2s;margin:0 auto}
.tldot.active .tldot-circle{background:#fff;width:10px;height:10px}
.tldot:hover .tldot-circle{background:rgba(255,255,255,.65)}
.tldot-lbl{font-size:8px;opacity:.35;white-space:nowrap}
#tl-live{padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:10px;font-weight:600;cursor:pointer;letter-spacing:.4px;flex-shrink:0;transition:background .2s}
#tl-live.active{background:rgba(255,255,255,.28);border-color:rgba(255,255,255,.4)}
#tl-live:hover{background:rgba(255,255,255,.22)}
#history-banner{display:none;width:calc(100% - 32px);max-width:420px;text-align:center;font-size:11px;opacity:.55;padding:4px 0 0;letter-spacing:.3px;z-index:1}
#history-banner.on{display:block}

/* footer */
#footer{width:calc(100% - 32px);max-width:420px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:1;padding-top:14px}
#age{font-size:11px;opacity:.32}
#loc{font-size:11.5px;opacity:.48;display:flex;align-items:center;gap:5px}
#btn{width:100%;padding:16px;background:rgba(255,255,255,.16);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.18);border-radius:16px;color:#fff;font-size:16px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .2s;font-family:inherit}
#btn:disabled{opacity:.32;cursor:default}
#btn:not(:disabled):hover{background:rgba(255,255,255,.25)}

/* badges */
.badge{position:fixed;top:14px;background:rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.1);border-radius:8px;font-size:10px;padding:4px 9px;z-index:30;letter-spacing:.5px;font-family:inherit;cursor:default}
#src-badge{left:14px}
#dbg-btn{right:14px;cursor:pointer;color:rgba(255,255,255,.35)}
#dbg-btn:hover{color:rgba(255,255,255,.7)}

/* debug */
#debug{position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,.92);backdrop-filter:blur(10px);padding:12px 16px 20px;font-size:10px;font-family:'SF Mono','Fira Code',monospace;max-height:220px;overflow-y:auto;display:none;z-index:10;border-top:1px solid rgba(255,255,255,.07)}
#debug.open{display:block}
#debug pre{color:#adf;line-height:1.65;white-space:pre-wrap}
</style>
</head>
<body>
<div id="bg">
  <div class="ring" id="r1"></div>
  <div class="ring lag" id="r2"></div>

  <div id="content">
    <div class="spin"></div>
    <div class="sub">Getting your location…</div>
  </div>

  <div id="pred-strip">
    <div class="pstat"><div class="pval" id="p-time">—</div><div class="plbl">hitting in</div></div>
    <div class="pdiv"></div>
    <div class="pstat"><div class="pval" id="p-dir">—</div><div class="plbl">approaching from</div></div>
    <div class="pdiv"></div>
    <div class="pstat"><div class="pval" id="p-size">—</div><div class="plbl">storm width</div></div>
  </div>

  <div id="map-wrap">
    <div id="map-hdr">
      <span id="map-title">Rain Radar · Singapore</span>
      <div id="map-legend">
        <span class="leg"><span class="leg-dot" style="background:#5090ff"></span>Light</span>
        <span class="leg"><span class="leg-dot" style="background:#ffcc00"></span>Moderate</span>
        <span class="leg"><span class="leg-dot" style="background:#ff4040"></span>Heavy</span>
      </div>
    </div>
    <canvas id="map"></canvas>
    <div id="timeline">
      <button id="tl-play" title="Play history">▶</button>
      <div id="tl-track"></div>
      <button id="tl-live" class="active">● LIVE</button>
    </div>
  </div>

  <div id="history-banner"></div>

  <div id="footer">
    <div id="age"></div>
    <div id="loc">
      <svg width="9" height="12" viewBox="0 0 9 12" fill="currentColor"><path d="M4.5 0C2.015 0 0 2.015 0 4.5 0 7.875 4.5 12 4.5 12S9 7.875 9 4.5C9 2.015 6.985 0 4.5 0zm0 6a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></svg>
      <span id="loc-text">Singapore</span>
    </div>
    <button id="btn" disabled>↺&nbsp; Check again</button>
  </div>
</div>

<div class="badge" id="src-badge">NEA</div>
<button class="badge" id="dbg-btn">debug</button>
<div id="debug"><pre id="dbg-pre"></pre></div>

<script>
'use strict';

// ── CONFIG ──────────────────────────────────────────────────────────────────
const DEFAULT_LAT = 1.2657294;
const DEFAULT_LNG = 103.8227098;
const NEA_URL     = 'https://api.data.gov.sg/v1/environment/rainfall';
const GEO_URL     = 'https://nominatim.openstreetmap.org/reverse';
const MAX_MM=5,I_THRESH=60,EPS_KM=5,MIN_PTS=2,DEF_SPEED=20,DELAY_T=10,WAIT_T=25;
const MAX_HIST=6;

// Map canvas bounds (covers SG + buffer)
const LAT_MIN=1.12,LAT_MAX=1.50,LNG_MIN=103.52,LNG_MAX=104.12;

// ── SINGAPORE COASTLINE (64-point polygon, clockwise from SW Tuas) ──────────
const SG = [
  [1.263,103.636],[1.260,103.649],[1.252,103.661],[1.250,103.679],
  [1.253,103.703],[1.265,103.717],[1.280,103.716],[1.305,103.695],
  [1.324,103.673],[1.345,103.650],[1.360,103.635],[1.380,103.620],
  [1.400,103.620],[1.420,103.630],[1.440,103.648],[1.455,103.670],
  [1.462,103.700],[1.464,103.730],[1.465,103.765],[1.465,103.820],
  [1.460,103.855],[1.455,103.880],[1.448,103.905],[1.438,103.923],
  [1.425,103.935],[1.415,103.948],[1.405,103.960],[1.390,103.975],
  [1.376,103.988],[1.362,104.004],[1.352,104.013],[1.345,104.019],
  [1.330,104.005],[1.320,103.996],[1.308,103.980],[1.295,103.963],
  [1.282,103.948],[1.275,103.933],[1.270,103.918],[1.267,103.900],
  [1.270,103.885],[1.276,103.869],[1.279,103.855],[1.278,103.840],
  [1.272,103.830],[1.265,103.820],[1.255,103.816],[1.248,103.820],
  [1.245,103.808],[1.240,103.800],[1.235,103.795],[1.228,103.792],
  [1.232,103.780],[1.240,103.772],[1.248,103.760],[1.253,103.748],
  [1.248,103.735],[1.245,103.720],[1.248,103.705],[1.255,103.692],
  [1.260,103.680],[1.264,103.665],[1.265,103.648],[1.263,103.636],
];

// Sentosa Island
const SENTOSA = [
  [1.253,103.800],[1.257,103.818],[1.255,103.840],[1.248,103.858],
  [1.242,103.848],[1.238,103.825],[1.242,103.803],[1.250,103.800],
];

// ── STATE ───────────────────────────────────────────────────────────────────
let userLat=DEFAULT_LAT, userLng=DEFAULT_LNG, locationLabel='Singapore';
let liveFrame=null;           // {cells,clusters,decision,source,timestamp}
let historyFrames=[];         // newest first, up to MAX_HIST entries
let viewingIdx=null;          // null=live, 0=newest history, MAX_HIST-1=oldest
let isPlaying=false, playTimer=null;
let mapRaf=null, pulseT=0;

// ── GEO HELPERS ─────────────────────────────────────────────────────────────
function hav(a1,o1,a2,o2){
  const R=6371,r=Math.PI/180,da=(a2-a1)*r,dl=(o2-o1)*r;
  const x=Math.sin(da/2)**2+Math.cos(a1*r)*Math.cos(a2*r)*Math.sin(dl/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
function bearingDeg(a1,o1,a2,o2){
  const r=Math.PI/180,dl=(o2-o1)*r;
  const y=Math.sin(dl)*Math.cos(a2*r);
  const x=Math.cos(a1*r)*Math.sin(a2*r)-Math.sin(a1*r)*Math.cos(a2*r)*Math.cos(dl);
  return(Math.atan2(y,x)*180/Math.PI+360)%360;
}
const COMPASS=['North','NE','East','SE','South','SW','West','NW'];
const ARROWS  =['↓','↙','←','↖','↑','↗','→','↘'];
const compass=d=>COMPASS[Math.round(d/45)%8];
const arrow  =d=>ARROWS[Math.round(d/45)%8];

// ── ALGORITHM ───────────────────────────────────────────────────────────────
function dbscan(pts,eps,min){
  const n=pts.length,L=new Array(n).fill(0);let id=1;
  const nb=i=>{const r=[];for(let j=0;j<n;j++)if(j!==i&&hav(pts[i].lat,pts[i].lng,pts[j].lat,pts[j].lng)<=eps)r.push(j);return r;};
  for(let i=0;i<n;i++){
    if(L[i])continue;const s=nb(i);
    if(s.length+1<min){L[i]=-1;continue;}
    L[i]=id;const q=new Set(s);
    for(const j of q){if(L[j]===-1)L[j]=id;if(L[j])continue;L[j]=id;const jn=nb(j);if(jn.length+1>=min)jn.forEach(r=>q.add(r));}
    id++;
  }
  const out=[];for(let c=1;c<id;c++)out.push(pts.filter((_,i)=>L[i]===c));
  return out;
}
function clusterCells(cells){
  const active=cells.filter(c=>c.intensity>I_THRESH);
  if(!active.length)return[];
  return dbscan(active,EPS_KM,MIN_PTS).map(pts=>{
    const lat=pts.reduce((s,p)=>s+p.lat,0)/pts.length;
    const lng=pts.reduce((s,p)=>s+p.lng,0)/pts.length;
    const maxI=Math.max(...pts.map(p=>p.intensity));
    const avgI=pts.reduce((s,p)=>s+p.intensity,0)/pts.length;
    const radiusKm=Math.max(1,...pts.map(p=>hav(lat,lng,p.lat,p.lng)));
    return{centroid:{lat,lng},points:pts,maxI,avgI,radiusKm};
  });
}
function decide(lat,lng,clusters){
  if(!clusters.length)
    return{state:'GO',minutes:999,confidence:90,message:'No rain detected nearby.',storm:null};
  let minT=Infinity,best=null,weak=true;
  for(const c of clusters){
    const d=hav(lat,lng,c.centroid.lat,c.centroid.lng);
    if(d<=c.radiusKm){
      const b=bearingDeg(lat,lng,c.centroid.lat,c.centroid.lng);
      return{state:'DELAY',minutes:0,confidence:80,message:"You're inside the rain right now.",
        storm:{bearing:b,direction:compass(b),edgeDistKm:0,radiusKm:c.radiusKm,centroid:c.centroid}};
    }
    if(c.avgI>80)weak=false;
    const t=((d-c.radiusKm)/DEF_SPEED)*60;
    if(t<minT){minT=t;best=c;}
  }
  if(minT===Infinity||!best)
    return{state:'GO',minutes:999,confidence:80,message:'Rain moving away. Safe to go.',storm:null};
  const m=Math.round(minT),conf=weak?70:80;
  const b=bearingDeg(lat,lng,best.centroid.lat,best.centroid.lng);
  const storm={bearing:b,direction:compass(b),
    edgeDistKm:+(hav(lat,lng,best.centroid.lat,best.centroid.lng)-best.radiusKm).toFixed(1),
    radiusKm:best.radiusKm,centroid:best.centroid};
  if(m<DELAY_T)return{state:'DELAY',minutes:m,confidence:conf,message:`Rain reaches you in about ${m} minutes.`,storm};
  if(m<WAIT_T) return{state:'WAIT', minutes:m,confidence:conf,message:`Rain will reach you in about ${m} minutes.`,storm};
  return{state:'GO',minutes:m,confidence:conf,message:`Rain is ${m} minutes away — safe to go.`,storm};
}

// ── DATA FETCH ──────────────────────────────────────────────────────────────
async function fetchData(){
  try{
    const r=await fetch(NEA_URL,{signal:AbortSignal.timeout(8000)});
    if(!r.ok)throw 0;
    const j=await r.json();
    if(!j?.metadata?.stations)throw 0;
    const{metadata:{stations},items}=j;
    const ts=items[0]?.timestamp??new Date().toISOString();
    const map={};
    for(const s of stations)map[s.id]={lat:s.location.latitude,lng:s.location.longitude,intensity:0};
    for(const rd of(items[0]?.readings??[]))
      if(map[rd.station_id])map[rd.station_id].intensity=Math.min(255,Math.round((rd.value/MAX_MM)*255));
    return{cells:Object.values(map),source:'live',timestamp:ts};
  }catch{return{cells:mockCells(),source:'mock',timestamp:new Date().toISOString()};}
}
async function getLocation(){
  return new Promise(resolve=>{
    if(!navigator.geolocation)return resolve({lat:DEFAULT_LAT,lng:DEFAULT_LNG,fallback:true});
    navigator.geolocation.getCurrentPosition(
      p=>resolve({lat:p.coords.latitude,lng:p.coords.longitude,fallback:false}),
      ()=>resolve({lat:DEFAULT_LAT,lng:DEFAULT_LNG,fallback:true}),
      {timeout:8000,maximumAge:60000}
    );
  });
}
async function reverseGeocode(lat,lng){
  try{
    const r=await fetch(`${GEO_URL}?lat=${lat}&lon=${lng}&format=json&zoom=16&addressdetails=1`,
      {headers:{'User-Agent':'RainGo/1.0'},signal:AbortSignal.timeout(5000)});
    const j=await r.json();
    const a=j.address??{};
    const parts=[a.road||a.pedestrian||'',a.suburb||a.neighbourhood||''].filter(Boolean);
    return parts.length?parts.join(', '):(a.city??'Singapore');
  }catch{return'Singapore';}
}

// ── MOCK DATA ────────────────────────────────────────────────────────────────
function mockCells(){
  return[
    {lat:1.265,lng:103.823,intensity:0},{lat:1.271,lng:103.796,intensity:0},
    {lat:1.279,lng:103.851,intensity:0},{lat:1.249,lng:103.830,intensity:0},
    {lat:1.294,lng:103.786,intensity:0},{lat:1.312,lng:103.765,intensity:0},
    {lat:1.281,lng:103.800,intensity:0},{lat:1.335,lng:103.780,intensity:28},
    {lat:1.320,lng:103.810,intensity:18},{lat:1.353,lng:103.835,intensity:42},
    {lat:1.345,lng:103.850,intensity:31},{lat:1.415,lng:103.830,intensity:190},
    {lat:1.405,lng:103.815,intensity:215},{lat:1.398,lng:103.842,intensity:195},
    {lat:1.423,lng:103.836,intensity:175},{lat:1.410,lng:103.800,intensity:145},
    {lat:1.438,lng:103.789,intensity:88},{lat:1.427,lng:103.770,intensity:82},
    {lat:1.350,lng:103.957,intensity:0},{lat:1.364,lng:103.992,intensity:0},
    {lat:1.380,lng:103.920,intensity:0},{lat:1.369,lng:103.845,intensity:5},
  ];
}
function buildMockHistory(baseCells){
  // Simulate storm moving south over past 30 min (0.013°lat ≈ 1.45km per 5min step)
  return Array.from({length:MAX_HIST},(_,i)=>{
    const offset=(MAX_HIST-i)*0.013;
    const cells=baseCells.map(c=>c.intensity>I_THRESH?{...c,lat:c.lat+offset}:c);
    const clusters=clusterCells(cells);
    const decision=decide(userLat,userLng,clusters);
    return{cells,clusters,decision,
      timestamp:new Date(Date.now()-(MAX_HIST-i)*5*60*1000).toISOString(),
      label:`${(MAX_HIST-i)*5}m ago`};
  });
}

// ── CANVAS DRAWING ───────────────────────────────────────────────────────────
function toXY(lat,lng,W,H){
  return[(lng-LNG_MIN)/(LNG_MAX-LNG_MIN)*W,(LAT_MAX-lat)/(LAT_MAX-LAT_MIN)*H];
}

function drawPolygon(ctx,poly,W,H,fill,stroke,lw=1){
  ctx.beginPath();
  poly.forEach(([la,lo],i)=>{const[x,y]=toXY(la,lo,W,H);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
  ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();}
}

function drawRainClouds(ctx,cells,W,H){
  ctx.save();
  ctx.globalCompositeOperation='lighter'; // additive: overlapping clouds get brighter
  for(const c of cells){
    if(c.intensity<6)continue;
    const[x,y]=toXY(c.lat,c.lng,W,H);
    const t=c.intensity/255;
    const r=(W*0.042)+(t*W*0.048); // blob radius grows with intensity
    const g=ctx.createRadialGradient(x,y,0,x,y,r);
    if(t<0.30){
      // light — blue
      g.addColorStop(0,`rgba(60,110,255,${0.32+t*0.8})`);
      g.addColorStop(0.45,`rgba(60,110,255,${0.12})`);
      g.addColorStop(1,`rgba(60,110,255,0)`);
    }else if(t<0.65){
      // moderate — yellow
      const s=(t-0.30)/0.35;
      g.addColorStop(0,`rgba(255,${Math.round(220-s*80)},30,${0.45+t*0.35})`);
      g.addColorStop(0.45,`rgba(255,180,30,0.14)`);
      g.addColorStop(1,`rgba(255,180,30,0)`);
    }else{
      // heavy — orange→red
      const s=(t-0.65)/0.35;
      g.addColorStop(0,`rgba(255,${Math.round(80-s*80)},30,${0.6+t*0.3})`);
      g.addColorStop(0.45,`rgba(255,50,30,0.18)`);
      g.addColorStop(1,`rgba(255,50,30,0)`);
    }
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

function drawStormCluster(ctx,c,W,H,pulse){
  const[cx,cy]=toXY(c.centroid.lat,c.centroid.lng,W,H);
  const kmPx=W/((LNG_MAX-LNG_MIN)*111.32*Math.cos(c.centroid.lat*Math.PI/180));
  const baseR=Math.max(10,c.radiusKm*kmPx);
  const glowR=baseR*(1.4+pulse*0.25);

  // outer glow
  const og=ctx.createRadialGradient(cx,cy,baseR*0.6,cx,cy,glowR);
  og.addColorStop(0,`rgba(255,90,60,${0.18+pulse*0.06})`);
  og.addColorStop(1,'rgba(255,70,40,0)');
  ctx.fillStyle=og;ctx.beginPath();ctx.arc(cx,cy,glowR,0,Math.PI*2);ctx.fill();

  // inner fill
  const ig=ctx.createRadialGradient(cx,cy,0,cx,cy,baseR);
  ig.addColorStop(0,'rgba(255,110,80,0.22)');
  ig.addColorStop(0.7,'rgba(255,80,60,0.12)');
  ig.addColorStop(1,'rgba(255,80,60,0.03)');
  ctx.fillStyle=ig;ctx.beginPath();ctx.arc(cx,cy,baseR,0,Math.PI*2);ctx.fill();

  // dashed border ring
  ctx.save();ctx.setLineDash([4,3]);
  ctx.strokeStyle=`rgba(255,130,100,${0.55+pulse*0.25})`;ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(cx,cy,baseR,0,Math.PI*2);ctx.stroke();
  ctx.restore();

  // centroid dot
  ctx.fillStyle='rgba(255,160,140,0.92)';ctx.beginPath();ctx.arc(cx,cy,3,0,Math.PI*2);ctx.fill();
}

function drawMap(frame,uLat,uLng,pulse){
  const canvas=document.getElementById('map');
  const dpr=window.devicePixelRatio||1;
  const W=canvas.offsetWidth;
  if(!W)return;
  const H=Math.round(W*0.56);
  if(canvas.width!==W*dpr){canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.height=H+'px';}
  const ctx=canvas.getContext('2d');
  ctx.save();ctx.scale(dpr,dpr);

  // sea background
  const sea=ctx.createLinearGradient(0,0,0,H);
  sea.addColorStop(0,'#070b1c');sea.addColorStop(1,'#0c1128');
  ctx.fillStyle=sea;ctx.fillRect(0,0,W,H);

  // subtle lat/lng grid
  ctx.strokeStyle='rgba(255,255,255,0.035)';ctx.lineWidth=.5;
  for(let la=1.15;la<=1.48;la+=0.05){const[,y]=toXY(la,LNG_MIN,W,H);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  for(let lo=103.55;lo<=104.10;lo+=0.05){const[x]=toXY(LAT_MIN,lo,W,H);ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}

  // Singapore main island (land fill then coastline)
  drawPolygon(ctx,SG,W,H,'rgba(28,38,62,0.9)','rgba(70,110,175,0.55)',1.3);
  // Sentosa
  drawPolygon(ctx,SENTOSA,W,H,'rgba(28,38,62,0.85)','rgba(70,110,175,0.4)',1);

  // Rain cloud blobs
  drawRainClouds(ctx,frame.cells,W,H);

  // Storm cluster glows (on top of clouds)
  for(const c of frame.clusters)drawStormCluster(ctx,c,W,H,pulse);

  // User location — pulsing white dot
  const[ux,uy]=toXY(uLat,uLng,W,H);
  // outer pulse ring
  ctx.beginPath();ctx.arc(ux,uy,8+pulse*7,0,Math.PI*2);
  ctx.fillStyle=`rgba(255,255,255,${0.15*(1-pulse)})`;ctx.fill();
  // inner halo
  ctx.beginPath();ctx.arc(ux,uy,6,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,0.25)';ctx.fill();
  // solid dot
  ctx.beginPath();ctx.arc(ux,uy,4,0,Math.PI*2);
  ctx.fillStyle='#fff';ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=1;ctx.stroke();
  // label
  ctx.font=`bold 8.5px -apple-system,sans-serif`;
  ctx.fillStyle='rgba(255,255,255,0.7)';ctx.textAlign='center';
  ctx.fillText('You',ux,uy+15);

  // direction line from user to nearest storm
  if(frame.decision?.storm?.centroid){
    const sc=frame.decision.storm.centroid;
    const[sx,sy]=toXY(sc.lat,sc.lng,W,H);
    const dx=sx-ux,dy=sy-uy,mag=Math.sqrt(dx*dx+dy*dy);
    if(mag>20){
      const nx=dx/mag,ny=dy/mag;
      ctx.save();ctx.setLineDash([3,4]);
      ctx.strokeStyle='rgba(255,255,255,0.18)';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(ux+nx*8,uy+ny*8);ctx.lineTo(sx-nx*12,sy-ny*12);
      ctx.stroke();ctx.restore();
    }
  }

  // Compass (bottom-right)
  const cr=10,cpx=W-16,cpy=H-16;
  ctx.font='7.5px sans-serif';ctx.fillStyle='rgba(255,255,255,0.28)';ctx.textAlign='center';
  ctx.fillText('N',cpx,cpy-cr-1);ctx.fillText('S',cpx,cpy+cr+8);
  ctx.fillText('W',cpx-cr-4,cpy+3);ctx.fillText('E',cpx+cr+4,cpy+3);
  ctx.beginPath();ctx.arc(cpx,cpy,cr*.35,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,0.18)';ctx.fill();

  ctx.restore();
}

// ── ANIMATION LOOP ───────────────────────────────────────────────────────────
function startAnim(){
  if(mapRaf)cancelAnimationFrame(mapRaf);
  function tick(){
    pulseT=(pulseT+0.015)%1;
    const frame=viewingIdx===null?liveFrame:historyFrames[viewingIdx];
    if(frame)drawMap(frame,userLat,userLng,pulseT);
    mapRaf=requestAnimationFrame(tick);
  }tick();
}

// ── HISTORY UI ───────────────────────────────────────────────────────────────
function updateTimeline(){
  const track=document.getElementById('tl-track');
  track.innerHTML='';
  historyFrames.forEach((f,i)=>{
    const div=document.createElement('div');div.className='tldot'+(i===viewingIdx?' active':'');
    const ts=new Date(f.timestamp);
    const mins=Math.round((Date.now()-ts)/60000);
    div.innerHTML=`<div class="tldot-circle"></div><div class="tldot-lbl">${mins}m</div>`;
    div.addEventListener('click',()=>showFrame(i));
    track.appendChild(div);
  });
  document.getElementById('tl-live').className='tl-live'+(viewingIdx===null?' active':'');
}

function showFrame(idx){
  stopPlay();
  viewingIdx=idx;
  updateTimeline();
  const frame=historyFrames[idx];
  const banner=document.getElementById('history-banner');
  const mins=Math.round((Date.now()-new Date(frame.timestamp))/60000);
  banner.textContent=`◷ Viewing radar from ${mins} minutes ago`;
  banner.classList.add('on');
  updateDecisionUI(frame.decision,frame.clusters,frame.source,frame.timestamp);
}

function showLive(){
  stopPlay();
  viewingIdx=null;
  document.getElementById('history-banner').classList.remove('on');
  updateTimeline();
  if(liveFrame)updateDecisionUI(liveFrame.decision,liveFrame.clusters,liveFrame.source,liveFrame.timestamp);
}

function startPlay(){
  if(isPlaying){stopPlay();return;}
  isPlaying=true;document.getElementById('tl-play').textContent='⏸';
  let i=historyFrames.length-1;
  function next(){
    if(!isPlaying)return;
    if(i<0){showLive();document.getElementById('tl-play').textContent='▶';isPlaying=false;return;}
    viewingIdx=i;updateTimeline();
    const frame=historyFrames[i];
    const banner=document.getElementById('history-banner');
    const mins=Math.round((Date.now()-new Date(frame.timestamp))/60000);
    banner.textContent=`◷ Viewing radar from ${mins} minutes ago`;banner.classList.add('on');
    updateDecisionUI(frame.decision,frame.clusters,frame.source,frame.timestamp);
    i--;playTimer=setTimeout(next,750);
  }next();
}
function stopPlay(){
  isPlaying=false;document.getElementById('tl-play').textContent='▶';clearTimeout(playTimer);
}

// ── RENDER ───────────────────────────────────────────────────────────────────
const ICONS={GO:'☀️',WAIT:'🌦️',DELAY:'⛈️'};
function hl(d){
  if(d.state==='GO')return'Safe to go';
  if(d.state==='WAIT')return d.minutes<999?`Rain in ${d.minutes} min`:'Rain coming';
  return d.minutes===0?"It's raining now":`Rain in ${d.minutes} min`;
}

function renderLoading(msg){
  document.getElementById('bg').className='';
  document.getElementById('r1').className='ring';
  document.getElementById('r2').className='ring lag';
  document.getElementById('content').innerHTML=`<div class="spin"></div><div class="sub">${msg}</div>`;
  document.getElementById('btn').disabled=true;
  document.getElementById('age').textContent='';
  document.getElementById('pred-strip').classList.remove('on');
}

function updateDecisionUI(decision,clusters,source,timestamp){
  // background
  document.getElementById('bg').className=decision.state.toLowerCase();
  const rings=decision.state!=='GO';
  document.getElementById('r1').className='ring'+(rings?' on':'');
  document.getElementById('r2').className='ring lag'+(rings?' on':'');

  // source badge
  const sb=document.getElementById('src-badge');
  sb.textContent=source==='live'?'NEA LIVE':'NEA DEMO';
  sb.style.color=source==='live'?'rgba(122,226,140,.85)':'rgba(255,209,102,.75)';

  // decision card
  const showNum=(decision.state==='WAIT'||decision.state==='DELAY')&&decision.minutes>0&&decision.minutes<999;
  document.getElementById('content').innerHTML=`
    <div class="icon">${ICONS[decision.state]??'🌫️'}</div>
    ${showNum?`<div class="big-num">${decision.minutes}</div><div class="big-unit">minutes</div>`:''}
    <div class="headline">${hl(decision)}</div>
    <div class="sub">${decision.message}</div>
    <div class="conf-pill">
      <span class="cdot ${decision.confidence>=80?'hi':'lo'}"></span>
      ${decision.confidence}% confidence
    </div>`;

  // prediction strip
  const strip=document.getElementById('pred-strip');
  if(decision.storm&&decision.state!=='GO'){
    strip.classList.add('on');
    document.getElementById('p-time').textContent=
      decision.minutes>0&&decision.minutes<999?`${decision.minutes} min`:'Now';
    document.getElementById('p-dir').innerHTML=
      `${arrow(decision.storm.bearing)}&nbsp;${decision.storm.direction}`;
    document.getElementById('p-size').textContent=
      `${Math.round(decision.storm.radiusKm*2)} km`;
  }else{strip.classList.remove('on');}

  // data age
  const age=Math.round((Date.now()-new Date(timestamp))/1000);
  document.getElementById('age').textContent=
    age<60?'Radar updated just now':`Radar updated ${Math.floor(age/60)} min ago`;
  document.getElementById('btn').disabled=false;

  // debug
  document.getElementById('dbg-pre').textContent=JSON.stringify({
    location:{lat:+userLat.toFixed(5),lng:+userLng.toFixed(5),label:locationLabel},
    source,timestamp,
    activeClusters:clusters.length,
    clusters:clusters.map(c=>({centroid:{lat:+c.centroid.lat.toFixed(4),lng:+c.centroid.lng.toFixed(4)},
      radiusKm:+c.radiusKm.toFixed(1),avgIntensity:Math.round(c.avgI),stations:c.points.length})),
    decision,
  },null,2);
}

// ── REFRESH ──────────────────────────────────────────────────────────────────
let refreshTimer=null;
async function refresh(){
  clearTimeout(refreshTimer);stopPlay();viewingIdx=null;

  renderLoading('Getting your location…');
  const pos=await getLocation();
  userLat=pos.lat;userLng=pos.lng;

  renderLoading('Checking rain radar…');
  const[label,radarData]=await Promise.all([reverseGeocode(userLat,userLng),fetchData()]);
  locationLabel=pos.fallback?'Singapore (location unavailable)':label;
  document.getElementById('loc-text').textContent=locationLabel;

  const cells=radarData.cells;
  const clusters=clusterCells(cells);
  const decision=decide(userLat,userLng,clusters);

  // Push previous live frame to history
  if(liveFrame){
    historyFrames.unshift(liveFrame);
    if(historyFrames.length>MAX_HIST)historyFrames.pop();
  }

  liveFrame={cells,clusters,decision,source:radarData.source,timestamp:radarData.timestamp};

  // On first load with mock data, pre-fill history so timeline is immediately useful
  if(historyFrames.length===0&&radarData.source==='mock'){
    historyFrames=buildMockHistory(cells);
  }

  updateDecisionUI(decision,clusters,radarData.source,radarData.timestamp);
  document.getElementById('history-banner').classList.remove('on');
  updateTimeline();
  startAnim();

  refreshTimer=setTimeout(refresh,5*60*1000);
}

// ── EVENTS ───────────────────────────────────────────────────────────────────
document.getElementById('tl-play').addEventListener('click',startPlay);
document.getElementById('tl-live').addEventListener('click',showLive);
document.getElementById('btn').addEventListener('click',refresh);
document.getElementById('dbg-btn').addEventListener('click',()=>document.getElementById('debug').classList.toggle('open'));
window.addEventListener('resize',()=>{
  const frame=viewingIdx===null?liveFrame:historyFrames[viewingIdx];
  if(frame)drawMap(frame,userLat,userLng,pulseT);
});

refresh();
</script>
