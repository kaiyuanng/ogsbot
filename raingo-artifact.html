<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RainGo</title>
<style>
:root{
  --go-1:#0D9E5A;--go-2:#0A7A44;
  --wait-1:#E8920A;--wait-2:#C47208;
  --delay-1:#D42B2B;--delay-2:#A01F1F;
  --idle-1:#1C1C2E;--idle-2:#111120;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',system-ui,sans-serif;color:#fff}
body{min-height:100vh;overflow-y:auto;overflow-x:hidden}

#bg{
  min-height:100vh;
  background:linear-gradient(145deg,var(--idle-1),var(--idle-2));
  transition:background .5s ease;
  display:flex;flex-direction:column;align-items:center;
  position:relative;padding-bottom:24px;
}
#bg.go   {background:linear-gradient(145deg,var(--go-1),var(--go-2))}
#bg.wait {background:linear-gradient(145deg,var(--wait-1),var(--wait-2))}
#bg.delay{background:linear-gradient(145deg,var(--delay-1),var(--delay-2))}

/* ── Pulse rings ── */
.ring{position:absolute;top:50%;left:50%;transform:translate(-50%,-280px);
  width:300px;height:300px;border-radius:50%;
  border:1.5px solid rgba(255,255,255,.28);opacity:0;display:none}
.ring.on{display:block;animation:expand 2.4s ease-out infinite}
.ring.on.lag{animation-delay:.9s}
@keyframes expand{0%{transform:translate(-50%,-280px) scale(.5);opacity:.3}100%{transform:translate(-50%,-280px) scale(1.6);opacity:0}}

/* ── Decision section ── */
#content{
  display:flex;flex-direction:column;align-items:center;gap:22px;
  padding:80px 28px 28px;text-align:center;z-index:1;width:100%;max-width:420px;
}
.icon{font-size:68px;line-height:1;filter:drop-shadow(0 4px 14px rgba(0,0,0,.25))}
.big-num{font-size:80px;font-weight:800;letter-spacing:-2px;line-height:1;text-shadow:0 2px 14px rgba(0,0,0,.2)}
.big-unit{font-size:14px;opacity:.5;margin-top:-8px;letter-spacing:.6px;text-transform:uppercase}
.headline{font-size:clamp(28px,7vw,44px);font-weight:700;letter-spacing:-.5px;line-height:1.1;text-shadow:0 2px 8px rgba(0,0,0,.15)}
.sub{font-size:16px;opacity:.82;max-width:300px;line-height:1.55}
.conf-pill{display:flex;align-items:center;gap:7px;padding:6px 14px;background:rgba(255,255,255,.12);border-radius:100px;font-size:13px;font-weight:500;opacity:.68}
.cdot{width:7px;height:7px;border-radius:50%}
.cdot.hi{background:#7AE28C}.cdot.lo{background:#FFD166}

/* ── Prediction strip (rain incoming details) ── */
#pred-strip{
  display:none;width:100%;max-width:380px;margin:0 auto;
  background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.12);
  border-radius:16px;padding:14px 20px;
  display:none;flex-direction:row;justify-content:space-around;gap:8px;
  backdrop-filter:blur(8px);
}
#pred-strip.visible{display:flex}
.pred-stat{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
.pred-val{font-size:20px;font-weight:700;letter-spacing:-.3px}
.pred-lbl{font-size:10px;opacity:.5;letter-spacing:.4px;text-transform:uppercase}
.pred-divider{width:1px;background:rgba(255,255,255,.15);align-self:stretch}

/* ── Spinner ── */
.spin{width:42px;height:42px;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:rot .75s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* ── Radar map section ── */
#map-wrap{
  width:100%;max-width:420px;padding:0 16px;z-index:1;margin-top:4px;
}
#map-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding:0 4px}
#map-title{font-size:11px;font-weight:600;opacity:.45;letter-spacing:.8px;text-transform:uppercase}
#map-legend{display:flex;gap:10px;align-items:center}
.leg-item{display:flex;align-items:center;gap:4px;font-size:9px;opacity:.4;letter-spacing:.3px}
.leg-dot{width:7px;height:7px;border-radius:50%}
canvas#map{
  width:100%;border-radius:14px;display:block;
  border:1px solid rgba(255,255,255,.08);
}

/* ── Footer ── */
#footer{
  width:100%;max-width:420px;padding:16px 24px 0;
  display:flex;flex-direction:column;align-items:center;gap:9px;z-index:1;
}
#age{font-size:11px;opacity:.35;letter-spacing:.2px}
#loc{font-size:12px;opacity:.5;display:flex;align-items:center;gap:5px}
#btn{
  width:100%;padding:17px;
  background:rgba(255,255,255,.18);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.2);border-radius:16px;
  color:#fff;font-size:17px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:background .2s;font-family:inherit;
}
#btn:disabled{opacity:.35;cursor:default}
#btn:not(:disabled):hover{background:rgba(255,255,255,.26)}

/* ── Badges ── */
.badge{position:fixed;top:14px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.12);border-radius:8px;font-size:10px;padding:4px 9px;z-index:20;letter-spacing:.5px;font-family:inherit;cursor:default}
#src-badge{left:14px}
#dbg-btn{right:14px;cursor:pointer;color:rgba(255,255,255,.35)}
#dbg-btn:hover{color:rgba(255,255,255,.7)}

/* ── Debug ── */
#debug{position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,.9);backdrop-filter:blur(10px);padding:12px 16px 20px;font-size:10.5px;font-family:'SF Mono','Fira Code',monospace;max-height:240px;overflow-y:auto;display:none;z-index:10;border-top:1px solid rgba(255,255,255,.08)}
#debug.open{display:block}
#debug pre{color:#adf;line-height:1.65;white-space:pre-wrap}
</style>
</head>
<body>
<div id="bg">
  <div class="ring" id="r1"></div>
  <div class="ring lag" id="r2"></div>

  <!-- Decision -->
  <div id="content">
    <div class="spin"></div>
    <div class="sub">Getting your location…</div>
  </div>

  <!-- Rain prediction details -->
  <div id="pred-strip">
    <div class="pred-stat">
      <div class="pred-val" id="p-time">—</div>
      <div class="pred-lbl">hitting in</div>
    </div>
    <div class="pred-divider"></div>
    <div class="pred-stat">
      <div class="pred-val" id="p-dir">—</div>
      <div class="pred-lbl">from</div>
    </div>
    <div class="pred-divider"></div>
    <div class="pred-stat">
      <div class="pred-val" id="p-size">—</div>
      <div class="pred-lbl">storm width</div>
    </div>
  </div>

  <!-- Radar map -->
  <div id="map-wrap">
    <div id="map-header">
      <span id="map-title">Live Radar · Singapore</span>
      <div id="map-legend">
        <span class="leg-item"><span class="leg-dot" style="background:#64b4ff"></span>Light</span>
        <span class="leg-item"><span class="leg-dot" style="background:#ffc832"></span>Moderate</span>
        <span class="leg-item"><span class="leg-dot" style="background:#ff3c3c"></span>Heavy</span>
      </div>
    </div>
    <canvas id="map"></canvas>
  </div>

  <!-- Footer -->
  <div id="footer">
    <div id="age"></div>
    <div id="loc">
      <svg width="9" height="12" viewBox="0 0 9 12" fill="none"><path d="M4.5 0C2.015 0 0 2.015 0 4.5 0 7.875 4.5 12 4.5 12S9 7.875 9 4.5C9 2.015 6.985 0 4.5 0zm0 6a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z" fill="currentColor"/></svg>
      <span id="loc-text">Singapore</span>
    </div>
    <button id="btn" disabled>↺&nbsp; Check again</button>
  </div>
</div>

<div class="badge" id="src-badge">NEA</div>
<button class="badge" id="dbg-btn">debug</button>
<div id="debug"><pre id="dbg-pre"></pre></div>

<script>
'use strict';

// ─── FALLBACK coords (used if location denied) ──────────────────────────────
const DEFAULT_LAT = 1.2657294;
const DEFAULT_LNG = 103.8227098;

// ─── CONSTANTS ──────────────────────────────────────────────────────────────
const NEA_URL      = 'https://api.data.gov.sg/v1/environment/rainfall';
const GEOCODE_URL  = 'https://nominatim.openstreetmap.org/reverse';
const MAX_MM=5, I_THRESH=60, EPS_KM=5, MIN_PTS=2, DEF_SPEED=20, DELAY_THRESH=10, WAIT_THRESH=25;

// Radar canvas bounds (covers Singapore + buffer)
const LAT_MIN=1.12, LAT_MAX=1.50, LNG_MIN=103.52, LNG_MAX=104.12;

// Simplified Singapore coastline polygon [lat, lng]
const SG_COAST = [
  [1.263,103.636],[1.325,103.600],[1.388,103.618],[1.445,103.680],
  [1.452,103.780],[1.448,103.840],[1.440,103.900],[1.415,103.940],
  [1.385,103.985],[1.355,104.000],[1.315,104.010],[1.285,103.980],
  [1.262,103.955],[1.245,103.880],[1.218,103.830],[1.225,103.757],
  [1.263,103.636],
];

// ─── MUTABLE STATE ──────────────────────────────────────────────────────────
let userLat = DEFAULT_LAT, userLng = DEFAULT_LNG;
let locationLabel = 'Singapore';
let lastCells = [], lastClusters = [];
let mapAnimFrame = null;

// ─── GEOLOCATION ────────────────────────────────────────────────────────────
function getLocation(){
  return new Promise(resolve=>{
    if(!navigator.geolocation)return resolve({lat:DEFAULT_LAT,lng:DEFAULT_LNG,fallback:true});
    navigator.geolocation.getCurrentPosition(
      p=>resolve({lat:p.coords.latitude,lng:p.coords.longitude,fallback:false}),
      ()=>resolve({lat:DEFAULT_LAT,lng:DEFAULT_LNG,fallback:true}),
      {timeout:8000,maximumAge:60000}
    );
  });
}

// ─── REVERSE GEOCODE ────────────────────────────────────────────────────────
async function reverseGeocode(lat,lng){
  try{
    const r=await fetch(`${GEOCODE_URL}?lat=${lat}&lon=${lng}&format=json&zoom=16&addressdetails=1`,
      {headers:{'User-Agent':'RainGo/1.0'},signal:AbortSignal.timeout(5000)});
    const j=await r.json();
    const a=j.address??{};
    const road=a.road||a.pedestrian||a.footway||'';
    const area=a.suburb||a.neighbourhood||a.quarter||a.city_district||'';
    const parts=[road,area].filter(Boolean);
    return parts.length?parts.join(', '):(a.city??'Singapore');
  }catch{return'Singapore';}
}

// ─── BEARING + COMPASS ──────────────────────────────────────────────────────
function bearingDeg(lat1,lng1,lat2,lng2){
  const r=Math.PI/180;
  const dL=(lng2-lng1)*r;
  const y=Math.sin(dL)*Math.cos(lat2*r);
  const x=Math.cos(lat1*r)*Math.sin(lat2*r)-Math.sin(lat1*r)*Math.cos(lat2*r)*Math.cos(dL);
  return(Math.atan2(y,x)*180/Math.PI+360)%360;
}
function compass(deg){
  const d=['North','NE','East','SE','South','SW','West','NW'];
  return d[Math.round(deg/45)%8];
}
function dirArrow(deg){
  // Arrow showing which direction the rain is coming FROM (toward user)
  const a=['↓','↙','←','↖','↑','↗','→','↘'];
  return a[Math.round(deg/45)%8];
}

// ─── HAVERSINE ──────────────────────────────────────────────────────────────
function hav(a1,o1,a2,o2){
  const R=6371,r=Math.PI/180,da=(a2-a1)*r,dl=(o2-o1)*r;
  const x=Math.sin(da/2)**2+Math.cos(a1*r)*Math.cos(a2*r)*Math.sin(dl/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// ─── DBSCAN ─────────────────────────────────────────────────────────────────
function dbscan(pts,eps,min){
  const n=pts.length,L=new Array(n).fill(0);let id=1;
  const nb=i=>{const r=[];for(let j=0;j<n;j++)if(j!==i&&hav(pts[i].lat,pts[i].lng,pts[j].lat,pts[j].lng)<=eps)r.push(j);return r;};
  for(let i=0;i<n;i++){
    if(L[i])continue;const s=nb(i);
    if(s.length+1<min){L[i]=-1;continue;}
    L[i]=id;const q=new Set(s);
    for(const j of q){if(L[j]===-1)L[j]=id;if(L[j])continue;L[j]=id;const jn=nb(j);if(jn.length+1>=min)jn.forEach(r=>q.add(r));}
    id++;
  }
  const out=[];for(let c=1;c<id;c++)out.push(pts.filter((_,i)=>L[i]===c));
  return out;
}

// ─── CLUSTERING ─────────────────────────────────────────────────────────────
function clusterCells(cells){
  const active=cells.filter(c=>c.intensity>I_THRESH);
  if(!active.length)return[];
  return dbscan(active,EPS_KM,MIN_PTS).map(pts=>{
    const lat=pts.reduce((s,p)=>s+p.lat,0)/pts.length;
    const lng=pts.reduce((s,p)=>s+p.lng,0)/pts.length;
    const maxI=Math.max(...pts.map(p=>p.intensity));
    const avgI=pts.reduce((s,p)=>s+p.intensity,0)/pts.length;
    const radiusKm=Math.max(1,...pts.map(p=>hav(lat,lng,p.lat,p.lng)));
    return{centroid:{lat,lng},points:pts,maxI,avgI,radiusKm};
  });
}

// ─── DECISION ENGINE ────────────────────────────────────────────────────────
function decide(lat,lng,clusters){
  if(!clusters.length)
    return{state:'GO',minutes:999,confidence:90,message:'No rain detected nearby.',storm:null};

  let minT=Infinity,nearestC=null,weak=true;

  for(const c of clusters){
    const d=hav(lat,lng,c.centroid.lat,c.centroid.lng);
    if(d<=c.radiusKm){
      const b=bearingDeg(lat,lng,c.centroid.lat,c.centroid.lng);
      return{
        state:'DELAY',minutes:0,confidence:80,
        message:"You're inside the rain right now.",
        storm:{bearing:b,direction:compass(b),edgeDistKm:0,radiusKm:c.radiusKm,centroid:c.centroid},
      };
    }
    if(c.avgI>80)weak=false;
    const edge=d-c.radiusKm;
    const t=(edge/DEF_SPEED)*60;
    if(t<minT){minT=t;nearestC=c;}
  }

  if(minT===Infinity||!nearestC)
    return{state:'GO',minutes:999,confidence:80,message:'Rain detected but moving away.',storm:null};

  const m=Math.round(minT),conf=weak?70:80;
  const b=bearingDeg(lat,lng,nearestC.centroid.lat,nearestC.centroid.lng);
  const storm={
    bearing:b,direction:compass(b),
    edgeDistKm:Math.round(hav(lat,lng,nearestC.centroid.lat,nearestC.centroid.lng)-nearestC.radiusKm),
    radiusKm:nearestC.radiusKm,centroid:nearestC.centroid,
  };

  if(m<DELAY_THRESH)
    return{state:'DELAY',minutes:m,confidence:conf,message:`Rain reaches you in about ${m} minutes.`,storm};
  if(m<WAIT_THRESH)
    return{state:'WAIT',minutes:m,confidence:conf,message:`Rain will reach you in about ${m} minutes.`,storm};
  return{state:'GO',minutes:m,confidence:conf,message:`Rain is ${m} minutes away — safe to go.`,storm};
}

// ─── FETCH NEA ───────────────────────────────────────────────────────────────
async function fetchData(){
  try{
    const r=await fetch(NEA_URL,{signal:AbortSignal.timeout(8000)});
    if(!r.ok)throw 0;
    const j=await r.json();
    if(!j?.metadata?.stations)throw 0;
    const{metadata:{stations},items}=j;
    const ts=items[0]?.timestamp??new Date().toISOString();
    const map={};
    for(const s of stations)map[s.id]={lat:s.location.latitude,lng:s.location.longitude,intensity:0};
    for(const rd of(items[0]?.readings??[]))
      if(map[rd.station_id])map[rd.station_id].intensity=Math.min(255,Math.round((rd.value/MAX_MM)*255));
    return{cells:Object.values(map),source:'live',timestamp:ts};
  }catch{
    return{cells:mockCells(),source:'mock',timestamp:new Date().toISOString()};
  }
}

// ─── MOCK DATA ───────────────────────────────────────────────────────────────
function mockCells(){
  return[
    {lat:1.265,lng:103.823,intensity:0},{lat:1.271,lng:103.796,intensity:0},
    {lat:1.279,lng:103.851,intensity:0},{lat:1.249,lng:103.830,intensity:0},
    {lat:1.294,lng:103.786,intensity:0},{lat:1.312,lng:103.765,intensity:0},
    {lat:1.281,lng:103.800,intensity:0},{lat:1.335,lng:103.780,intensity:28},
    {lat:1.320,lng:103.810,intensity:18},{lat:1.353,lng:103.835,intensity:42},
    {lat:1.345,lng:103.850,intensity:31},{lat:1.415,lng:103.830,intensity:190},
    {lat:1.405,lng:103.815,intensity:215},{lat:1.398,lng:103.842,intensity:195},
    {lat:1.423,lng:103.836,intensity:175},{lat:1.410,lng:103.800,intensity:145},
    {lat:1.438,lng:103.789,intensity:88},{lat:1.427,lng:103.770,intensity:82},
    {lat:1.350,lng:103.957,intensity:0},{lat:1.364,lng:103.992,intensity:0},
    {lat:1.380,lng:103.920,intensity:0},{lat:1.369,lng:103.845,intensity:5},
  ];
}

// ─── RADAR MAP ───────────────────────────────────────────────────────────────
function toXY(lat,lng,W,H){
  return[
    (lng-LNG_MIN)/(LNG_MAX-LNG_MIN)*W,
    (LAT_MAX-lat)/(LAT_MAX-LAT_MIN)*H,
  ];
}

function drawMap(cells,clusters,uLat,uLng,pulse){
  const canvas=document.getElementById('map');
  const dpr=window.devicePixelRatio||1;
  const W=canvas.offsetWidth;
  const H=Math.round(W*0.55);
  canvas.width=W*dpr; canvas.height=H*dpr;
  canvas.style.height=H+'px';
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);

  // Background
  ctx.fillStyle='#0c0c1e';
  ctx.fillRect(0,0,W,H);

  // Grid
  ctx.strokeStyle='rgba(255,255,255,0.04)';ctx.lineWidth=.5;
  for(let la=1.15;la<=1.48;la+=0.05){const[,y]=toXY(la,LNG_MIN,W,H);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  for(let lo=103.55;lo<=104.10;lo+=0.05){const[x]=toXY(LAT_MIN,lo,W,H);ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}

  // Singapore coastline
  ctx.beginPath();
  SG_COAST.forEach(([la,lo],i)=>{const[x,y]=toXY(la,lo,W,H);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
  ctx.closePath();
  ctx.fillStyle='rgba(255,255,255,0.03)';ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.18)';ctx.lineWidth=1;ctx.stroke();

  // Rain cells
  for(const c of cells){
    if(c.intensity<8)continue;
    const[x,y]=toXY(c.lat,c.lng,W,H);
    const t=c.intensity/255;
    const r=2+t*5;
    let col;
    if(t<0.33)col=`rgba(80,160,255,${.35+t})`;
    else if(t<0.66)col=`rgba(255,200,40,${.5+t*.5})`;
    else col=`rgba(255,55,55,${.65+t*.35})`;
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle=col;ctx.fill();
  }

  // Storm cluster radius circles
  for(const c of clusters){
    const[cx,cy]=toXY(c.centroid.lat,c.centroid.lng,W,H);
    const pxPerKm=W/((LNG_MAX-LNG_MIN)*111.32*Math.cos(c.centroid.lat*Math.PI/180));
    const rPx=Math.max(6,c.radiusKm*pxPerKm);
    ctx.beginPath();ctx.arc(cx,cy,rPx,0,Math.PI*2);
    ctx.fillStyle='rgba(255,70,70,0.10)';ctx.fill();
    ctx.strokeStyle='rgba(255,100,100,0.55)';ctx.lineWidth=1.5;ctx.stroke();

    // Storm centroid dot
    ctx.beginPath();ctx.arc(cx,cy,3.5,0,Math.PI*2);
    ctx.fillStyle='rgba(255,130,130,.95)';ctx.fill();
  }

  // User location (pulsing)
  const[ux,uy]=toXY(uLat,uLng,W,H);
  const pulseR=6+pulse*5;
  ctx.beginPath();ctx.arc(ux,uy,pulseR,0,Math.PI*2);
  ctx.fillStyle=`rgba(255,255,255,${0.12*(1-pulse)})`;ctx.fill();
  ctx.beginPath();ctx.arc(ux,uy,5,0,Math.PI*2);
  ctx.fillStyle='#fff';ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.25)';ctx.lineWidth=1;ctx.stroke();

  // "You" label
  ctx.font=`bold 9px -apple-system,sans-serif`;
  ctx.fillStyle='rgba(255,255,255,0.65)';ctx.textAlign='center';
  ctx.fillText('You',ux,uy+16);

  // Compass rose (tiny, bottom right)
  const cx2=W-16,cy2=H-16,cr=8;
  ctx.font='7px sans-serif';ctx.fillStyle='rgba(255,255,255,0.25)';
  ctx.textAlign='center';
  ctx.fillText('N',cx2,cy2-cr-2);
  ctx.fillText('S',cx2,cy2+cr+8);
  ctx.fillText('W',cx2-cr-5,cy2+3);
  ctx.fillText('E',cx2+cr+5,cy2+3);
  ctx.beginPath();ctx.arc(cx2,cy2,cr*.4,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,0.2)';ctx.fill();
}

// ─── ANIMATED MAP LOOP ───────────────────────────────────────────────────────
let pulseT=0;
function startMapLoop(){
  if(mapAnimFrame)cancelAnimationFrame(mapAnimFrame);
  function frame(){
    pulseT=(pulseT+0.018)%1;
    drawMap(lastCells,lastClusters,userLat,userLng,pulseT);
    mapAnimFrame=requestAnimationFrame(frame);
  }
  frame();
}

// ─── RENDER ─────────────────────────────────────────────────────────────────
const ICONS={GO:'☀️',WAIT:'🌦️',DELAY:'⛈️'};
function hl(d){
  if(d.state==='GO')return'Safe to go';
  if(d.state==='WAIT')return d.minutes<999?`Rain in ${d.minutes} min`:'Rain coming';
  if(d.state==='DELAY')return d.minutes===0?"It's raining now":`Rain in ${d.minutes} min`;
  return'—';
}

function renderLoading(msg){
  document.getElementById('bg').className='';
  ['r1','r2'].forEach(id=>document.getElementById(id).className='ring');
  document.getElementById('content').innerHTML=`<div class="spin"></div><div class="sub">${msg}</div>`;
  document.getElementById('btn').disabled=true;
  document.getElementById('age').textContent='';
  document.getElementById('pred-strip').classList.remove('visible');
}

function render({decision,clusters,source,timestamp}){
  // Background
  document.getElementById('bg').className=decision.state.toLowerCase();
  const rings=decision.state!=='GO';
  document.getElementById('r1').className='ring'+(rings?' on':'');
  document.getElementById('r2').className='ring lag'+(rings?' on':'');

  // Source badge
  const sb=document.getElementById('src-badge');
  sb.textContent=source==='live'?'NEA LIVE':'NEA DEMO';
  sb.style.color=source==='live'?'rgba(122,226,140,.8)':'rgba(255,209,102,.7)';

  // Location label
  document.getElementById('loc-text').textContent=locationLabel;

  // Main decision card
  const showNum=(decision.state==='WAIT'||decision.state==='DELAY')&&decision.minutes>0&&decision.minutes<999;
  document.getElementById('content').innerHTML=`
    <div class="icon">${ICONS[decision.state]??'🌫️'}</div>
    ${showNum?`<div class="big-num">${decision.minutes}</div><div class="big-unit">minutes</div>`:''}
    <div class="headline">${hl(decision)}</div>
    <div class="sub">${decision.message}</div>
    <div class="conf-pill">
      <span class="cdot ${decision.confidence>=80?'hi':'lo'}"></span>
      ${decision.confidence}% confidence
    </div>`;

  // Prediction strip — only when storm is approaching
  const strip=document.getElementById('pred-strip');
  if(decision.storm&&decision.state!=='GO'){
    strip.classList.add('visible');
    const mins=decision.minutes>0?`${decision.minutes} min`:'Now';
    document.getElementById('p-time').textContent=mins;
    document.getElementById('p-dir').innerHTML=`${dirArrow(decision.storm.bearing)} ${decision.storm.direction}`;
    document.getElementById('p-size').textContent=`${Math.round(decision.storm.radiusKm*2)} km`;
  }else{
    strip.classList.remove('visible');
  }

  // Data age
  const ageSec=Math.round((Date.now()-new Date(timestamp))/1000);
  document.getElementById('age').textContent=
    ageSec<60?'Radar updated just now':`Radar updated ${Math.floor(ageSec/60)} min ago`;
  document.getElementById('btn').disabled=false;

  // Debug
  document.getElementById('dbg-pre').textContent=JSON.stringify({
    location:{lat:+userLat.toFixed(5),lng:+userLng.toFixed(5),label:locationLabel},
    source,timestamp,
    activeClusters:clusters.length,
    clusters:clusters.map(c=>({
      centroid:{lat:+c.centroid.lat.toFixed(4),lng:+c.centroid.lng.toFixed(4)},
      radiusKm:+c.radiusKm.toFixed(1),avgIntensity:Math.round(c.avgI),stations:c.points.length,
    })),
    decision,
  },null,2);
}

// ─── REFRESH ────────────────────────────────────────────────────────────────
let timer=null;
async function refresh(){
  clearTimeout(timer);

  renderLoading('Getting your location…');
  const pos=await getLocation();
  userLat=pos.lat; userLng=pos.lng;

  renderLoading('Checking rain radar…');
  const[label,radarData]=await Promise.all([
    reverseGeocode(userLat,userLng),
    fetchData(),
  ]);
  locationLabel=pos.fallback?'Singapore (location unavailable)':label;

  lastCells=radarData.cells;
  lastClusters=clusterCells(radarData.cells);
  const decision=decide(userLat,userLng,lastClusters);

  render({decision,clusters:lastClusters,source:radarData.source,timestamp:radarData.timestamp});
  startMapLoop();

  timer=setTimeout(refresh,5*60*1000);
}

// ─── EVENTS ─────────────────────────────────────────────────────────────────
document.getElementById('dbg-btn').addEventListener('click',()=>{
  document.getElementById('debug').classList.toggle('open');
});
document.getElementById('btn').addEventListener('click',refresh);
window.addEventListener('resize',()=>drawMap(lastCells,lastClusters,userLat,userLng,pulseT));

refresh();
</script>
</body>
</html>
